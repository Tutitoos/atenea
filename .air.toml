# Hot reload for local development only. Never in CI, never in production:
# this is the cosmtrek/air reloader, not the data tool of the same name.
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/atenea ./cmd/atenea"
  bin = "./tmp/atenea"
  args_bin = ["run"]
  include_ext = ["go", "toml"]
  exclude_dir = ["tmp", "docs", "bin", "dist"]
  exclude_regex = ["_test\\.go"]
  delay = 300
  stop_on_error = true
  send_interrupt = true
  kill_delay = "10s"

[log]
  time = true

[misc]
  clean_on_exit = true
