name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
    steps:
      - uses: actions/checkout@v4

      # Hugo modules are fetched with the Go toolchain, so the theme needs no
      # vendored copy and no git submodule. docs/ is its own Go module with its
      # own toolchain requirement, independent from the core.
      - uses: actions/setup-go@v5
        with:
          go-version-file: docs/go.mod

      - name: Install Hugo
        run: |
          curl -fsSL -o hugo.tar.gz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf hugo.tar.gz hugo
          sudo install hugo /usr/local/bin/hugo

      # enablement turns Pages on through the API on the first run. Without it
      # the deploy fails until somebody clicks through the repository settings,
      # which is a setup step that lives nowhere and nobody remembers. The
      # `pages: write` permission above is what makes it possible.
      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true

      - name: Build
        working-directory: docs
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
