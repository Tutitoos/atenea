name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "benchmarks/**"
      - "cmd/atenea-benchmark/**"
      - "internal/benchmark/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "benchmarks/**"
      - "cmd/atenea-benchmark/**"
      - "internal/benchmark/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUGO_VERSION: 0.165.0
    steps:
      - uses: actions/checkout@v7

      # Hugo modules are fetched with the Go toolchain, so the theme needs no
      # vendored copy and no git submodule. docs/ is its own Go module with its
      # own toolchain requirement, independent from the core.
      - uses: actions/setup-go@v7
        with:
          go-version-file: docs/go.mod

      - name: Install Hugo
        run: |
          curl -fsSL -o hugo.tar.gz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf hugo.tar.gz hugo
          sudo install hugo /usr/local/bin/hugo

      - name: Render benchmark documentation
        run: go run ./cmd/atenea-benchmark --render-only --input benchmarks/runs/latest/summary.json

      # Pages has to exist before this can deploy to it, and GITHUB_TOKEN
      # cannot create it: `pages: write` deploys to a site, creating one is
      # repository administration and that escalation is closed on purpose.
      # `enablement: true` therefore does NOT work here -- it fails with
      # "Resource not accessible by integration". Turning it on is a one-off,
      # done with an account that administers the repository:
      #
      #   gh api -X POST /repos/Tutitoos/atenea/pages -f build_type=workflow
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
        id: pages

      - name: Build
        working-directory: docs
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url || 'https://tutitoos.github.io/atenea' }}/"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/public

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
