name: v1-readiness

on:
  workflow_dispatch:
    inputs:
      live_mcp:
        description: "Run the live MCP bridge handshake"
        required: false
        default: false
        type: boolean
  pull_request:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  gate:
    name: readiness gate
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Run reproducible pre-v1 gate
        run: bash scripts/v1-readiness.sh

  native-build:
    name: native build / ${{ matrix.os }} / ${{ matrix.arch }}
    timeout-minutes: 30
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: macos-15
            os: darwin
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and report native binary
        run: |
          set -eu
          go build -trimpath -buildvcs=false -o /tmp/atenea ./cmd/atenea
          /tmp/atenea version

  live-mcp:
    name: opt-in live MCP bridge
    timeout-minutes: 30
    if: ${{ vars.ATENEA_LIVE_MCP == 'true' || (github.event_name == 'workflow_dispatch' && inputs.live_mcp) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ATENEA_MCP_CHECK: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Start service and handshake
        run: bash scripts/mcp-live-check.sh
