name: v1-readiness

on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  gate:
    name: readiness gate
    runs-on: ubuntu-latest
    env:
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run reproducible pre-v1 gate
        run: bash scripts/v1-readiness.sh

  native-build:
    name: native build / ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: macos-14
            os: darwin
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
    env:
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and report native binary
        run: |
          set -eu
          go build -trimpath -buildvcs=false -o /tmp/atenea ./cmd/atenea
          /tmp/atenea version

  live-mcp:
    name: opt-in live MCP bridge
    if: ${{ vars.ATENEA_LIVE_MCP == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TMPDIR: /tmp
      ATENEA_MCP_CHECK: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Start service and handshake
        run: bash scripts/mcp-live-check.sh

  live-opencode:
    name: opt-in OpenCode provider and MCP matrix
    if: ${{ vars.ATENEA_OPENCODE_SMOKE == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TMPDIR: /tmp
      ATENEA_OPENCODE_SMOKE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run provider/MCP matrix
        run: bash scripts/opencode-matrix.sh
