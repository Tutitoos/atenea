name: host-footer

# The widget must compose with the host footer, never replace it. Test actual
# legacy and modern registrations; host implementation changes need no copy.

on:
  pull_request:
    paths:
      - "internal/statusline/**"
      - ".github/workflows/host-footer.yml"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "internal/statusline/**"
      - ".github/workflows/host-footer.yml"

permissions:
  contents: read

concurrency:
  group: host-footer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  footer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Verify additive footer registration
        run: go test -count=1 -v ./internal/statusline/ -run HostFooter
