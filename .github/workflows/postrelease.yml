name: postrelease

on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        # No default. A default here is a number nobody maintains: it named
        # 1.0.1 for four releases. Required and empty makes the operator say
        # which release they are smoke-testing, which is the only answer that
        # cannot go stale.
        description: Release version to smoke-test (for example 1.0.5)
        required: true

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: smoke / ${{ matrix.os }} / ${{ matrix.arch }}
    timeout-minutes: 30
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: macos-14
            os: darwin
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Test the public release lifecycle
        env:
          ATENEA_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version || github.event.workflow_run.head_branch }}
        run: bash scripts/release-smoke.sh "$RELEASE_VERSION"
