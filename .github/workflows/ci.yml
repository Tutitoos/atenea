name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build / ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: amd64
    env:
      # macOS has a short Unix-socket path limit. Keeping temporary test
      # fixtures under /tmp makes the same suite reproducible locally and in
      # Actions instead of depending on the runner's long temp directory.
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite:"
            echo "$unformatted"
            exit 1
          fi

      - name: Tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1

      - name: Coverage canonical target
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/coverage-check.sh coverage.out

      - name: Coverage matrix floor
        if: matrix.os != 'ubuntu-latest'
        env:
          ATENEA_COVERAGE_TARGET: "77.0"
        run: bash scripts/coverage-check.sh coverage.out

      - name: Coverage history regression
        if: matrix.os == 'ubuntu-latest'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/coverage-history-check.sh coverage.out

      - name: Benchmark thresholds
        run: bash scripts/benchmark-check.sh

      - name: DAG load smoke
        run: bash scripts/load-check.sh

      - name: Validate benchmark summary artifact
        run: bash scripts/validate-benchmark-summary.sh benchmarks/summary.json

      - name: Declared provider matrix
        run: bash scripts/provider-matrix-check.sh

      - name: Upload coverage
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out
          if-no-files-found: error

      - name: Upload coverage history point
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v6
        with:
          name: atenea-coverage-history
          path: coverage-summary.txt
          retention-days: 90
          if-no-files-found: error

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
