name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build / ${{ matrix.os }} / ${{ matrix.arch }}
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: amd64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite:"
            echo "$unformatted"
            exit 1
          fi

      - name: Tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1

      - name: Coverage canonical target
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/coverage-check.sh coverage.out

      - name: Coverage matrix floor
        if: matrix.os != 'ubuntu-latest'
        env:
          ATENEA_COVERAGE_TARGET: "77.0"
        run: bash scripts/coverage-check.sh coverage.out

      - name: Coverage history regression
        if: matrix.os == 'ubuntu-latest'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/coverage-history-check.sh coverage.out

      - name: Benchmark thresholds
        run: bash scripts/benchmark-check.sh

      - name: DAG load smoke
        run: bash scripts/load-check.sh

      - name: Validate benchmark summary artifact
        run: bash scripts/validate-benchmark-summary.sh benchmarks/summary.json

      - name: Declared provider matrix
        run: bash scripts/provider-matrix-check.sh

      - name: Upload coverage
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out
          if-no-files-found: error

      - name: Upload coverage history point
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v6
        with:
          name: atenea-coverage-history
          path: coverage-summary.txt
          retention-days: 90
          if-no-files-found: error

  # The three widgets Atenea installs into opencode's screen are 1,173 lines of
  # TSX embedded in the binary, and nothing in a Go suite can tell whether they
  # parse. A syntax error ships, gets installed into a user's client config, and
  # is discovered when the status line stops drawing -- silently, because the
  # host has no way to report a plugin that failed to load.
  #
  # esbuild rather than tsc: there is no package.json, no tsconfig and no TS
  # toolchain in this repository, and adding one to answer "does this parse"
  # would be a node project's worth of maintenance for a question a parser
  # answers. It checks syntax, which is the failure that actually ships.
  widgets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Parse the embedded widgets
        run: |
          set -eu
          for widget in internal/statusline/opencode/*.tsx; do
            echo "== $widget"
            npx --yes esbuild@0.25.0 --jsx=automatic --log-level=warning "$widget" >/dev/null
          done

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
