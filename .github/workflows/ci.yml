name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    name: dashboard / frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install frontend dependencies
        run: bun ci --cwd dashboard
      - name: Check frontend
        run: bun run --cwd dashboard check
      - name: Build embedded frontend
        run: bun run --cwd dashboard build
      - name: Ensure generated assets are committed
        run: git diff --exit-code -- internal/dashboard/web/dist

  build:
    name: build / ${{ matrix.os }} / ${{ matrix.arch }}
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: amd64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite:"
            echo "$unformatted"
            exit 1
          fi

      - name: Tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Test
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1

      # Short, and only on one runner. A fuzz target's value is that it runs
      # at all -- a target nothing executes is a file, not a check -- and the
      # corpus that matters accumulates in the cache between runs. Thirty
      # seconds each is enough to catch a parser that panics on the shapes a
      # provider or a person can actually produce; it is not a campaign, and
      # it is not meant to be one.
      - name: Fuzz the parsers that read somebody else's bytes
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -eu
          go test ./internal/core -run '^$' -fuzz '^FuzzDispatchNeverPanicsOnArbitraryBytes$' -fuzztime=30s
          go test ./internal/config -run '^$' -fuzz '^FuzzLoadNeverPanics$' -fuzztime=30s
          go test ./internal/adapter/kivgraph -run '^$' -fuzz '^FuzzParseIndexReportNeverPanics$' -fuzztime=30s
          go test ./internal/adapter/desktop -run '^$' -fuzz '^FuzzInspectAnswerNeverPanics$' -fuzztime=30s
          go test ./internal/adapter/scrapling -run '^$' -fuzz '^FuzzFetchAnswerNeverPanics$' -fuzztime=30s
          go test ./internal/adapter/scrapling -run '^$' -fuzz '^FuzzTheGateNeverPanics$' -fuzztime=30s

      # The desktop helper is built here and shipped nowhere.
      #
      # It does not travel in a release because it could not be used if it
      # did: distributing a macOS binary that drives the screen needs a
      # Developer ID signature and notarization, and measured on macOS 26.6 an
      # Apple Development signature is rejected by Gatekeeper on any other
      # machine just as an unsigned one is. What DOES work is building it
      # here, on the user's own machine -- locally compiled code carries no
      # quarantine attribute, so Gatekeeper never enters, and no certificate
      # is needed by anybody.
      #
      # So what this step protects is the source: a helper that stopped
      # compiling would otherwise be discovered by the first person who tried
      # to build it, which is the worst possible moment.
      - name: Build the desktop helper
        if: startsWith(matrix.os, 'macos')
        run: |
          set -eu
          swift test --package-path helper -Xswiftc -strict-concurrency=complete
          swift build -c release --package-path helper
          # A real handshake. Started with no stdin the helper exits zero
          # having done nothing, so merely running it would pass for a binary
          # that cannot answer at all.
          probe='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}'
          answer="$(printf '%s\n' "$probe" | helper/.build/release/atenea-desktop-helper)"
          case "$answer" in
            *atenea-desktop-helper*) echo "helper answered its handshake" ;;
            *) echo "helper did not answer initialize: $answer" >&2; exit 1 ;;
          esac

      - name: Benchmark thresholds
        run: bash scripts/benchmark-check.sh

      - name: DAG load smoke
        run: bash scripts/load-check.sh

      - name: Validate benchmark summary artifact
        run: bash scripts/validate-benchmark-summary.sh benchmarks/summary.json

      - name: Declared provider matrix
        run: bash scripts/provider-matrix-check.sh

      - name: Validate the Scrapling Spider helper
        run: bash scripts/scrapling-spider-check.sh

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out
          if-no-files-found: error

  # go.mod carries the minimum supported toolchain. Keep one additional gate
  # on the current stable release so a language/runtime change is caught before
  # users who track stable see it, without multiplying every native matrix leg.
  stable:
    name: stable Go compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...

  # The three widgets Atenea installs into opencode's screen are 1,173 lines of
  # TSX embedded in the binary, and nothing in a Go suite can tell whether they
  # parse. A syntax error ships, gets installed into a user's client config, and
  # is discovered when the status line stops drawing -- silently, because the
  # host has no way to report a plugin that failed to load.
  #
  # esbuild rather than tsc: there is no package.json, no tsconfig and no TS
  # toolchain in this repository, and adding one to answer "does this parse"
  # would be a node project's worth of maintenance for a question a parser
  # answers. It checks syntax, which is the failure that actually ships.
  widgets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Parse the embedded widgets
        run: |
          set -eu
          for widget in internal/statusline/opencode/*.tsx; do
            echo "== $widget"
            npx --yes esbuild@0.28.2 --jsx=automatic --log-level=warning "$widget" >/dev/null
          done

  # Two runners, because a Go build tag decides which files exist and the
  # linter only ever sees one side. internal/platform/service_linux.go and
  # service_darwin.go are different code with the same job, and the ubuntu
  # runner had never read the second one: four exported functions there had
  # gone undocumented since they were written, invisible to a gate that
  # reported green on every pull request.
  #
  # Cross-linting instead of a second runner does not work here: DuckDB is a
  # cgo dependency, so type-checking a linux build from a mac fails in the
  # bindings before it reaches any of this repository's code. The same reason
  # the release workflow builds on native hosts.
  lint:
    name: lint / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
