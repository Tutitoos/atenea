# A tag is publishable only after the same source tree has passed the normal
# gates and produced native binaries on every supported release runner. DuckDB
# is a cgo dependency, so these builds intentionally happen on native hosts;
# pretending a cross-compiled binary is covered would make the release claim
# stronger than its validation.
#
# "The same gates" is meant literally, and used not to be: ci.yml has no tag
# trigger, so the verify job below re-runs formatting, tidiness, vet, the race
# suite, the benchmark and load barriers, the benchmark
# summary, the provider matrix and the policy anchors itself. A tag pushed to a
# commit that never reached main is validated by this file or by nothing.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: The tag must be the version the binary reports
        run: |
          set -eu
          want="${GITHUB_REF_NAME#v}"
          go build -trimpath -buildvcs=false -o /tmp/atenea ./cmd/atenea
          got="$(/tmp/atenea version | awk '/^atenea/ {print $2}' | cut -d+ -f1)"
          test "$want" = "$got" || {
            echo "tag ${GITHUB_REF_NAME} claims ${want}, the binary reports ${got}"
            exit 1
          }

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Changelog entry
        run: |
          set -eu
          want="${GITHUB_REF_NAME#v}"
          grep -q "^## \[${want}\]" CHANGELOG.md

      # From here down this job runs what ci.yml runs, and it runs it because
      # the header above claims a tag is only publishable after the same source
      # tree passed the normal gates -- which was not true. ci.yml has no tag
      # trigger, so on a tag pushed to a commit that never reached main, none of
      # these had ever executed and the release published anyway.
      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite:"
            echo "$unformatted"
            exit 1
          fi

      - name: Tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: Benchmark thresholds
        run: bash scripts/benchmark-check.sh

      - name: DAG load smoke
        run: bash scripts/load-check.sh

      - name: Validate benchmark summary artifact
        run: bash scripts/validate-benchmark-summary.sh benchmarks/summary.json

      - name: Declared provider matrix
        run: bash scripts/provider-matrix-check.sh

      - name: v1.0 policy anchors
        run: bash scripts/v1-policy-check.sh

  build:
    needs: verify
    name: artifact / ${{ matrix.goos }} / ${{ matrix.goarch }}
    timeout-minutes: 30
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-14
            goos: darwin
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and smoke-test artifact
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          artifact="atenea-${version}-${GOOS}-${GOARCH}"
          mkdir -p dist
          go build -trimpath -buildvcs=false -o "dist/$artifact" ./cmd/atenea
          case "$(uname -s)/$(uname -m)" in
            Linux/x86_64|Linux/amd64) host="linux/amd64" ;;
            Linux/aarch64|Linux/arm64) host="linux/arm64" ;;
            Darwin/x86_64|Darwin/amd64) host="darwin/amd64" ;;
            Darwin/arm64|Darwin/aarch64) host="darwin/arm64" ;;
            *) host="unknown" ;;
          esac
          if [ "$host" = "$GOOS/$GOARCH" ]; then
            "dist/$artifact" version
          else
            file "dist/$artifact"
          fi

      # The Claude Desktop extension is packed here, in the matrix, rather than
      # once on the Linux runner: manifest.json points at a native binary in
      # server/atenea, so a single .mcpb built on ubuntu installs without
      # complaint on a Mac and fails the first time the user opens a
      # conversation. One artifact per platform, named like the binaries.
      #
      # The packer is pinned. It runs against the tag being published, and a
      # release path that installs a floating version is a release whose output
      # nobody can reproduce.
      - name: Pack the Claude Desktop extension
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          artifact="atenea-${version}-${GOOS}-${GOARCH}"
          npm i --silent --no-audit --no-fund \
            --prefix "$RUNNER_TEMP/mcpb" @anthropic-ai/mcpb@2.1.2
          MCPB_BIN="$RUNNER_TEMP/mcpb/node_modules/.bin/mcpb" \
          ATENEA_BINARY="$PWD/dist/$artifact" \
          MCPB_OUTPUT="$PWD/dist/${artifact}.mcpb" \
            bash scripts/build-claude-mcpb.sh

      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/atenea-*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Add installer and checksums
        run: |
          set -eu
          cp scripts/install.sh dist/atenea-install.sh
          chmod 0755 dist/atenea-install.sh
          (cd dist && sha256sum atenea-* > SHA256SUMS)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## [${version}]" '
            $0 ~ "^## \\[" { if (found) exit; if (index($0, v) == 1) { found = 1; next } }
            found && $0 ~ "^\\[.*\\]: http" { exit }
            found { print }
          ' CHANGELOG.md > /tmp/notes.md
          test -s /tmp/notes.md
          prerelease=""
          case "$version" in 0.*) prerelease="--prerelease" ;; esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # A retry must repair the existing release instead of failing on
            # GitHub's duplicate-tag guard.
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            # shellcheck disable=SC2086
            gh release create "$GITHUB_REF_NAME" \
              --title "Atenea ${version}" \
              --notes-file /tmp/notes.md \
              ${prerelease} \
              dist/*
          fi
