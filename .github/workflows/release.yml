# A release is a tag, and the one thing a tag can silently get wrong is being a
# different number from the binary it names. Nothing else in the build catches
# that: the code compiles, the tests pass, and the artifact ships announcing a
# version nobody released.
#
# So the tag is checked against the binary before anything is published, by
# asking the binary rather than by reading the source -- the same question an
# operator asks, answered the same way.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version test compares the tag to what the working tree says, so
          # the tag has to be here. A shallow checkout arrives without it.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: The tag must be the version the binary reports
        run: |
          set -eu
          want="${GITHUB_REF_NAME#v}"
          go build -o /tmp/atenea ./cmd/atenea
          # Build metadata after the + says which tree this came from; the
          # release number is what has to match.
          got="$(/tmp/atenea version | awk '/^atenea/ {print $2}' | cut -d+ -f1)"
          if [ "$want" != "$got" ]; then
            echo "tag ${GITHUB_REF_NAME} claims ${want}, the binary reports ${got}"
            echo "bump internal/buildinfo.Version, or tag the version that is there"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} == binary ${got}"

      - name: Lint must be clean (the same gate CI runs on main)
        run: |
          set -eu
          # The same linter, the same version, the same configuration file CI
          # gates on -- so the question being answered here is exactly the one
          # CI would have answered if the tag had been a main push. Three
          # releases were cut on top of a red pipeline because nobody asked
          # this question at tag time.
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2
          "$(go env GOPATH)/bin/golangci-lint" run

      - name: The changelog must have this release in it
        run: |
          set -eu
          want="${GITHUB_REF_NAME#v}"
          grep -q "^## \[${want}\]" CHANGELOG.md || {
            echo "CHANGELOG.md has no '## [${want}]' section"
            exit 1
          }

      - name: Test
        run: go test -race -count=1 ./...

      # The measurement base is an embedded DuckDB, which is a cgo dependency,
      # so there is no free cross-compile: every target needs a C toolchain for
      # that target. `CGO_ENABLED=0` does not degrade gracefully either -- the
      # platform bindings are cgo-gated, so the build fails on undefined
      # symbols rather than producing a slower binary.
      #
      # So the release carries the one platform whose suite just passed on this
      # runner, and nothing else. A binary for a machine nobody has run Atenea
      # on is a claim the project cannot back: `atenea service install` is
      # implemented for systemd and says so everywhere else. Other platforms
      # build from source, which is what the README documents anyway.
      - name: Build the artifact
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          # Built from a tree with no VCS stamp, so it reports the bare number
          # -- which is what a release should say.
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -trimpath -buildvcs=false \
            -o "dist/atenea-${version}-linux-amd64" ./cmd/atenea
          ./dist/"atenea-${version}-linux-amd64" version
          cd dist && sha256sum atenea-* > SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          # The notes come out of the changelog rather than being written
          # twice. The section runs from this version's heading to the next
          # one -- or, for the oldest section in the file, to the link
          # definitions that collect at the bottom.
          awk -v v="## [${version}]" '
            $0 ~ "^## \\[" { if (found) exit; if (index($0, v) == 1) { found = 1; next } }
            found && $0 ~ "^\\[.*\\]: http" { exit }
            found { print }
          ' CHANGELOG.md > /tmp/notes.md
          test -s /tmp/notes.md || { echo "no notes extracted for ${version}"; exit 1; }

          # Alpha ships as a pre-release. 0.x.y is not a stable promise and
          # GitHub should not offer it as "latest" to somebody who never read
          # the version number.
          prerelease=""
          case "${version}" in
            0.*) prerelease="--prerelease" ;;
          esac

          # shellcheck disable=SC2086 # prerelease is one flag or nothing
          gh release create "${GITHUB_REF_NAME}" \
            --title "Atenea ${version}" \
            --notes-file /tmp/notes.md \
            ${prerelease} \
            dist/*
