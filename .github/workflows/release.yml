# A tag is publishable only after the same source tree has passed the normal
# gates and produced native binaries on every supported release runner. DuckDB
# is a cgo dependency, so these builds intentionally happen on native hosts;
# pretending a cross-compiled binary is covered would make the release claim
# stronger than its validation.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: The tag must be the version the binary reports
        run: |
          set -eu
          want="${GITHUB_REF_NAME#v}"
          go build -trimpath -buildvcs=false -o /tmp/atenea ./cmd/atenea
          got="$(/tmp/atenea version | awk '/^atenea/ {print $2}' | cut -d+ -f1)"
          test "$want" = "$got" || {
            echo "tag ${GITHUB_REF_NAME} claims ${want}, the binary reports ${got}"
            exit 1
          }

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Changelog entry
        run: |
          set -eu
          want="${GITHUB_REF_NAME#v}"
          grep -q "^## \[${want}\]" CHANGELOG.md

      - name: Test
        run: go test -race -count=1 ./...

  build:
    needs: verify
    name: artifact / ${{ matrix.goos }} / ${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-14
            goos: darwin
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and smoke-test artifact
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          artifact="atenea-${version}-${GOOS}-${GOARCH}"
          mkdir -p dist
          go build -trimpath -buildvcs=false -o "dist/$artifact" ./cmd/atenea
          case "$(uname -s)/$(uname -m)" in
            Linux/x86_64|Linux/amd64) host="linux/amd64" ;;
            Linux/aarch64|Linux/arm64) host="linux/arm64" ;;
            Darwin/x86_64|Darwin/amd64) host="darwin/amd64" ;;
            Darwin/arm64|Darwin/aarch64) host="darwin/arm64" ;;
            *) host="unknown" ;;
          esac
          if [ "$host" = "$GOOS/$GOARCH" ]; then
            "dist/$artifact" version
          else
            file "dist/$artifact"
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/atenea-*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Add installer and checksums
        run: |
          set -eu
          cp scripts/install.sh dist/atenea-install.sh
          chmod 0755 dist/atenea-install.sh
          (cd dist && sha256sum atenea-* > SHA256SUMS)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## [${version}]" '
            $0 ~ "^## \\[" { if (found) exit; if (index($0, v) == 1) { found = 1; next } }
            found && $0 ~ "^\\[.*\\]: http" { exit }
            found { print }
          ' CHANGELOG.md > /tmp/notes.md
          test -s /tmp/notes.md
          prerelease=""
          case "$version" in 0.*) prerelease="--prerelease" ;; esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # A retry must repair the existing release instead of failing on
            # GitHub's duplicate-tag guard.
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            # shellcheck disable=SC2086
            gh release create "$GITHUB_REF_NAME" \
              --title "Atenea ${version}" \
              --notes-file /tmp/notes.md \
              ${prerelease} \
              dist/*
          fi
