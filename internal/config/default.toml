[[capability]]
id = "graph.status"
version = "1.0.0"
summary = "Report the published graph: snapshot, provenance, counts and health."
semantics = """
The one repository-agnostic capability here, because the graph is one global thing. It \
reports the published snapshot and where it came from, its counts, and its dependency \
health. An empty or absent graph is reported AS a fault, never as a graph with zero of \
everything -- see the implementation note on requires_index below.\
"""
effects = ["read"]

  # Deliberately no inputs: the provider's own graph_status tool takes none
  # -- not even a repository filter -- and reports the whole published graph
  # every time. The draft here once offered an optional `repository` input;
  # a live call against the real tool showed it accepts zero arguments
  # (empty inputSchema, additionalProperties = false), so declaring one would
  # promise a scope the provider cannot honor.

  [[capability.output]]
  name = "snapshot"
  type = "record_list"
  required = true
  summary = "The published snapshot's provenance, counts and dependency health."

    [[capability.output.field]]
    name = "status"
    type = "string"
    required = true
    summary = "\"ready\", or the word the provider gives for why the graph cannot answer."

    [[capability.output.field]]
    name = "snapshot_id"
    type = "int"
    required = true
    summary = "The published snapshot's own generation number."

    [[capability.output.field]]
    name = "snapshot_built_at"
    type = "string"
    required = true
    summary = "When this snapshot was built, as the provider reports it."

    [[capability.output.field]]
    name = "symbols"
    type = "int"
    required = true
    summary = "How many symbols the published snapshot holds."

    [[capability.output.field]]
    name = "edges"
    type = "int"
    required = true
    summary = "How many resolved edges the published snapshot holds."

    [[capability.output.field]]
    name = "files"
    type = "int"
    required = true
    summary = "How many files the published snapshot covers."

    [[capability.output.field]]
    name = "repositories"
    type = "int"
    required = true
    summary = "How many repositories are registered in the published snapshot."

    [[capability.output.field]]
    name = "unresolved"
    type = "int"
    required = true
    summary = "How many references the snapshot recorded but could not resolve."

# ---------------------------------------------------------------------------
# Implementations: the "who and how". Four blocks each -- capability,
# constraints, cost and health.
#
# Health starts unknown for everyone: nothing has been probed yet. Declare a
# state here to take a provider out of the running by hand; once the health
# checker exists, live probes own this value.
# ---------------------------------------------------------------------------

[[implementation]]
id = "ripgrep"
provider = "ripgrep"
capability = "code.search"
scope_guarantee = "confined"   # targets() refuses any path outside scope before ripgrep ever runs

  [implementation.constraints]
  languages = []          # agnostic: it does not parse anything
  requires_index = false
  min_scale = ""
  max_scale = ""

  [implementation.cost]
  estimated_duration = "80ms"
  estimated_tokens = 400

[[implementation]]
id = "serena.search"
provider = "serena"
capability = "code.search"

  [implementation.constraints]
  languages = ["go", "typescript", "javascript", "python", "java", "rust", "php", "csharp"]
  requires_index = true
  min_scale = ""
  max_scale = ""

  [implementation.cost]
  estimated_duration = "600ms"
  estimated_tokens = 900

[[implementation]]
id = "claude.search"
provider = "claude-code"
capability = "code.search"
scope_guarantee = "filtered"   # the model is only asked nicely; every returned match is checked against scope afterward and dropped if it strays

  [implementation.constraints]
  languages = []          # a model reads whatever it is shown
  requires_index = false
  min_scale = ""
  max_scale = ""

  [implementation.cost]
  # Two orders of magnitude above ripgrep on both axes, and that is the point:
  # the funnel is cost-aware, so declaring this honestly is what keeps a model
  # from being chosen for work a tool already does well. It wins when the
  # cheaper providers are unhealthy or cannot work here at all.
  estimated_duration = "12s"
  estimated_tokens = 20000

# The three symbol implementations share a provider, and therefore share an
# index and a language list. Serena drives a language server per language: it
# understands only the ones it has a server for, and it is useless on a
# repository it has not indexed. Both facts are constraints, so both live here
# and not in the capability -- a capability that grew a language list would
# stop being swappable, which is the whole point of having one.
#
# The cost of all three is one activation plus two round trips: the adapter
# turns the position the capability speaks into the name path Serena speaks,
# and it asks Serena itself to do it rather than parsing code on its own.

[[implementation]]
id = "serena.definition"
provider = "serena"
capability = "symbol.definition"

  [implementation.constraints]
  languages = ["go", "typescript", "javascript", "python", "java", "rust", "php", "csharp"]
  requires_index = true
  min_scale = ""
  max_scale = ""

  [implementation.cost]
  estimated_duration = "700ms"
  estimated_tokens = 500

[[implementation]]
id = "serena.references"
provider = "serena"
capability = "symbol.references"

  [implementation.constraints]
  languages = ["go", "typescript", "javascript", "python", "java", "rust", "php", "csharp"]
  requires_index = true
  min_scale = ""
  max_scale = ""

  [implementation.cost]
  # Dearer than a definition: one answer versus every use site in the scope.
  estimated_duration = "1.5s"
  estimated_tokens = 1200

[[implementation]]
id = "serena.implementations"
provider = "serena"
capability = "symbol.implementations"

  [implementation.constraints]
  languages = ["go", "typescript", "javascript", "python", "java", "rust", "php", "csharp"]
  requires_index = true
  min_scale = ""
  max_scale = ""

  [implementation.cost]
  estimated_duration = "1.5s"
  estimated_tokens = 1200

[[implementation]]
id = "serena.overview"
provider = "serena"
capability = "symbol.overview"

  [implementation.constraints]
  languages = ["go", "typescript", "javascript", "python", "java", "rust", "php", "csharp"]
  requires_index = true
  min_scale = ""
  max_scale = ""

  [implementation.cost]
  # One overview call plus one find_symbol per name it reports, capped at 16
  # in flight together. Measured against this repository's own largest file
  # at nested depth (91 symbols): 392-630ms across eighteen live runs in two
  # independent sessions, returning ~6.5-7.5KB depending on JSON spacing
  # (~1700-1900 tokens); the estimate below rounds to the top of both ranges
  # rather than the middle, because a funnel that under-promises cost picks
  # this over a cheaper provider it should have lost to. Explicitly checked
  # for the cold tax other implementations on this page only guess at: two
  # serena.service restarts, each followed immediately by a call against the
  # same file, showed no measurable gap against calls already warm (514ms
  # and 502ms cold, inside the ordinary spread) -- for a repository this
  # size, get_symbols_overview and find_symbol are cheap enough that
  # gopls's own indexing is not the bottleneck this estimate needs to cover.
  estimated_duration = "700ms"
  estimated_tokens = 1900

# codebase-memory answers three of these from one call graph -- no second
# index, no second provider concept, just three questions the one graph can
# answer.

[[implementation]]
id = "codebase-memory.calls"
provider = "codebase-memory"
capability = "symbol.calls"

  [implementation.constraints]
  languages = []
  requires_index = true
  min_scale = "medium"    # the graph only pays for itself on a big repository
  max_scale = ""

  [implementation.cost]
  estimated_duration = "900ms"
  estimated_tokens = 600

[[implementation]]
id = "codebase-memory.overview"
provider = "codebase-memory"
capability = "symbol.overview"

  [implementation.constraints]
  languages = []
  requires_index = true
  min_scale = ""         # see below: unlike its siblings, this one does not walk
  max_scale = ""
  # depth 0 only. The graph holds what a file declares at its own top level
  # and nothing inside those declarations -- a struct's fields are not nodes
  # -- so a deeper ask would come back with the same list and read as a
  # complete answer to a different question. Serena descends properly and
  # keeps the deeper asks.
  max_input = { depth = 0 }
  # The kind this one reports is the graph's node label, and it will not
  # always be the word serena.overview uses for the same symbol. Measured: a
  # Go const comes back as "Variable" here and "Constant" from Serena. That
  # is not a defect to normalise away -- the graph has no Constant label and
  # no property separating a const from a var, so the distinction it would
  # have to report is one it never read. The capability says kind is the
  # provider's own word for this reason.

  [implementation.cost]
  # One query_graph round trip and one pass over the file to recover columns.
  # Its two siblings are held to min_scale = "medium" because a graph walk
  # only pays for its own index on a big repository; this one never walks --
  # it is a point lookup on an index that, by requires_index, already exists.
  # It also answers for markdown, where the headings are what the file
  # declares and no language server has anything to say.
  estimated_duration = "800ms"
  estimated_tokens = 400

[[implementation]]
id = "codebase-memory.impact"
provider = "codebase-memory"
capability = "code.impact"

  [implementation.constraints]
  languages = []
  requires_index = true
  requires_vcs = true     # walks a git diff against baseline; needs a repository under version control
  min_scale = "medium"
  max_scale = ""

  [implementation.cost]
  # Dearer than a single call-graph walk: one git diff plus one graph walk
  # per directly changed symbol, so cost scales with how much a commission
  # actually touched instead of staying flat like the others.
  estimated_duration = "2.5s"
  estimated_tokens = 1500

[[implementation]]
id = "codebase-memory.index"
provider = "codebase-memory"
capability = "repository.index"

  # Unrestricted on purpose, unlike its read-only siblings above: a small
  # repository the funnel would never pick this implementation for on a
  # *read* still has to be reachable for an explicit *build* -- that is the
  # whole path out of the false negative detection alone cannot fix.
  [implementation.constraints]
  languages = []
  requires_index = false  # this is how one gets built
  min_scale = ""
  max_scale = ""

  [implementation.cost]
  # A whole-repository walk, not one query against a graph already built --
  # measured at 0.5s / 2294 nodes on this repository's own source, cold
  # cache. Above codebase-memory.impact's own ceiling on purpose: this is
  # the expensive one, and mode="full" on a much larger repository would
  # spend more still.
  estimated_duration = "3s"
  # The answer is three scalars, not a list -- the one implementation here
  # whose token cost barely depends on repository size at all.
  estimated_tokens = 60

# The seven kivgraph implementations share one provider and one supervised
# stdio-MCP process (see [orchestrator.kivgraph] above): one child process,
# a handful of tools called against it over the same wire, no second index to
# build.
#
# Duration below is not a guess: it comes from the provider's own measured
# SLOs, not this page's usual "nearest shape already shipped" fallback --
# docs/performance/slo.md puts find_cross_repo_consumers at p95 <= 5ms, and
# benchmarks/mcp-client/report.md measures the backend itself at 0.014ms p95,
# both point queries against a published in-memory snapshot. The estimates
# below sit in the low tens of milliseconds instead of matching that
# directly, because they cost the stdio round trip on top -- one write and
# one read against the child's pipes -- which neither number above includes.
# Token sizes follow the usual sizing-by-shape reasoning.
#
# The three position-first implementations pay a get_file_outline call before
# their own tool, to turn a position into the declaration containing it, so
# they are declared at roughly twice the cost of the point lookups beside
# them. symbol.definition is the exception that pays only that one call: for
# a graph of declarations, the declaration a position falls inside of already
# IS the definition.
#
# What kivgraph is deliberately NOT declared for, so the funnel never
# promises it: symbol.implementations (this server exposes no tool that
# answers "who fulfils this interface" -- find_references reports uses, which
# is a different question) and code.impact (its subject is a baseline diff,
# and get_blast_radius walks out from a symbol, not from a change).

[[implementation]]
id = "kivgraph.cross_repo_consumers"
provider = "kivgraph"
capability = "symbol.consumers"

  [implementation.constraints]
  languages = []              # the graph is polyglot; language is the graph's problem, not the funnel's
  requires_index = true       # empty/absent graph -> detect reports not-indexed -> dropped, not answered empty
  min_scale = ""

  [implementation.cost]
  estimated_duration = "20ms"
  estimated_tokens = 900

[[implementation]]
id = "kivgraph.definition"
provider = "kivgraph"
capability = "symbol.definition"

  [implementation.constraints]
  languages = []
  requires_index = true

  [implementation.cost]
  estimated_duration = "15ms"
  estimated_tokens = 200

[[implementation]]
id = "kivgraph.references"
provider = "kivgraph"
capability = "symbol.references"

  [implementation.constraints]
  languages = []
  requires_index = true

  [implementation.cost]
  estimated_duration = "25ms"
  estimated_tokens = 800

[[implementation]]
id = "kivgraph.overview"
provider = "kivgraph"
capability = "symbol.overview"

  [implementation.constraints]
  languages = []
  requires_index = true

  [implementation.cost]
  estimated_duration = "15ms"
  estimated_tokens = 700

[[implementation]]
id = "kivgraph.get"
provider = "kivgraph"
capability = "symbol.get"

  [implementation.constraints]
  languages = []
  requires_index = true

  [implementation.cost]
  estimated_duration = "10ms"
  estimated_tokens = 300

[[implementation]]
id = "kivgraph.unresolved_references"
provider = "kivgraph"
capability = "symbol.unresolved"

  [implementation.constraints]
  languages = []
  requires_index = true

  [implementation.cost]
  estimated_duration = "25ms"
  estimated_tokens = 1200

[[implementation]]
id = "kivgraph.status"
provider = "kivgraph"
capability = "graph.status"

  [implementation.constraints]
  languages = []
  requires_index = true       # graph.status on an empty/absent graph is a fault; requires_index makes it one

  [implementation.cost]
  estimated_duration = "8ms"
  estimated_tokens = 200

# ---------------------------------------------------------------------------
# tokensave: the syntactic call graph of ONE rooted project.
#
# It answers the cold-start capability code.context first, then two of the same
# capabilities the graph providers above do. The cold start is why this adapter
# exists as more than another call-graph reader: a client holding only a task in
# prose cannot ask a position-first symbol question yet. tokensave keeps its
# own index in step on every call and never needs one built ahead of time,
# which is why none of the implementations below declares requires_index.
#
# No code.search here: tokensave has no text engine, and answering a flat
# search from a symbol index would be a different answer wearing the same
# name. No symbol.definition either -- see the adapter's package doc.
# ---------------------------------------------------------------------------

[[implementation]]
id = "tokensave.context"
provider = "tokensave"
capability = "code.context"

  [implementation.constraints]
  languages = []
  requires_index = false
  min_scale = ""
  max_scale = ""

  [implementation.cost]
  # Two calls: status, then tokensave_context. Measured on the workspace root
  # with snippets disabled: 1.3-4.6s warm depending on the query; the first
  # call may additionally pay the index resync. The base replaces this after
  # two successful calls.
  estimated_duration = "3s"
  estimated_tokens = 900
# ---------------------------------------------------------------------------

[[implementation]]
id = "tokensave.calls"
provider = "tokensave"
capability = "symbol.calls"

  [implementation.constraints]
  languages = []          # its parsers cover go, typescript, rust, python, js and more
  requires_index = false  # it syncs its own index on every call
  min_scale = ""
  max_scale = ""

  [implementation.cost]
  # Three tool calls for one answer -- status, entities, find_exact_symbol --
  # plus one walk per direction. Measured on a 53-repository index: 478ms warm,
  # 10.3s on the first call after the server starts, because tokensave re-syncs
  # its index before answering. The number below sits between the two on
  # purpose; the base replaces it with what this machine actually observes
  # after two successful calls.
  estimated_duration = "1s"
  estimated_tokens = 500

[[implementation]]
id = "tokensave.overview"
provider = "tokensave"
capability = "symbol.overview"

  [implementation.constraints]
  languages = []
  requires_index = false
  min_scale = ""
  max_scale = ""

  [implementation.cost]
  # Two tool calls and one file read for the columns no provider reports.
  # Measured: 4.3s warm on a 7.5k-file index, 14.4s cold. Same reasoning as
  # tokensave.calls above.
  estimated_duration = "2s"
  estimated_tokens = 300

# ---------------------------------------------------------------------------
# Repositories: the unit of work. Not the project -- the repository.
# ---------------------------------------------------------------------------

[[repository]]
id = "current"
path = "."
languages = ["go"]
scale = ""                # nobody has measured this repository yet, and unspecified never
                          # disqualifies; a guess of "small" drops every graph implementation
vcs = ""                  # unknown until declared; unspecified never disqualifies (pkg/contract/implementation.go)
indexed_by = []           # providers holding a ready index for this repository

# ---------------------------------------------------------------------------
# Agents: a program Atenea spawns with one task, which answers and dies.
#
# An agent is not a provider. A provider answers a capability and the funnel
# chooses between several of them; an agent is asked for by name, runs once,
# and hands back an answer in the shape declared here. Nothing ranks agents
# and nothing falls back between them.
#
# The wire is two JSON objects. Atenea writes the assignment to the agent's
# stdin -- ids, task, the context levels declared below, the limits, the
# effects it may cause, and the result schema built from `[[agent.result]]`.
# The agent writes one report to stdout: `result`, `verdict` (ok, failed,
# incomplete or canceled) and, for anything that is not a plain ok, a
# `reason` of `{kind, text}`. Exit status is not the channel: an agent that
# exits zero without a report has not answered, and is recorded as having
# died rather than as having succeeded.
#
# `command = "$atenea"` means this binary. It is the one placeholder, and it
# exists because the shipped agent is Atenea itself under another argument --
# a hard-coded path there would survive exactly until the next reinstall.
# Point `command` at any program to declare an agent of your own; a
# model-backed one differs only in what happens between reading stdin and
# writing stdout.
#
# `context` is a permission, not a delivery: only the levels named here are
# ever sent, and a level nobody declared is absent from the payload rather
# than present and empty. `effects` is a ceiling that a child agent can only
# narrow. Both limits are required -- an unset ceiling is not "no ceiling",
# it is a ceiling nobody decided.
# ---------------------------------------------------------------------------

[[agent]]
name = "filereader"
kind = "specialized"      # orchestrator decides and splits; specialized executes one objective
summary = "Reads one file and reports its size, its line count and its contents"
command = "$atenea"       # this binary
args = ["agent-exec", "filereader"]
context = ["repository"]  # enough to resolve a relative path; nothing else is sent
effects = ["read"]        # it reads a file and does nothing else
max_duration = "30s"
max_tokens = 1            # it spends no tokens; the ceiling still has to be a real number

  # The shape every answer is checked against. It becomes a strict JSON
  # schema -- additionalProperties false -- so an agent that invents a field
  # is refused rather than quietly believed.
  [[agent.result]]
  name = "path"
  type = "string"
  required = true
  summary = "The file that was read, as it was asked for"

  [[agent.result]]
  name = "content"
  type = "string"
  required = true
  summary = "What the file contains, empty when it was too large or not text"

  [[agent.result]]
  name = "lines"
  type = "int"
  required = true
  summary = "How many lines it has"

  [[agent.result]]
  name = "bytes"
  type = "int"
  required = true
  summary = "How many bytes it has"

[[agent]]
name = "reviewer"
kind = "specialized"
summary = "Re-reads what another agent answered about and says whether the answer holds"
command = "$atenea"
args = ["agent-exec", "reviewer"]
context = ["repository"]
effects = ["read"]
max_duration = "30s"
max_tokens = 1
# Reviews are scheduled in their own lane. A single pool holding both would
# starve the auditing exactly when the machine is busiest -- every slot full
# of agents and the reviewer queued behind the answers it is meant to judge.
# Nothing schedules anything yet; the lane belongs to the type, not to
# whoever dispatches it, so it is declared here rather than inferred later.
pool = "review"

  [[agent.result]]
  name = "checked"
  type = "int"
  required = true
  summary = "How many claims in the answer this review verified against the file"

  [[agent.result]]
  name = "subject"
  type = "string"
  required = false
  summary = "The run that was audited"

[[agent]]
name = "plan-check"
kind = "specialized"
summary = "Reads a plan as TOML and says whether the engine would accept it"
command = "$atenea"
args = ["agent-exec", "plan-check"]
context = ["repository"]
effects = ["read"]        # it compiles a graph in memory; nothing is written
max_duration = "30s"
max_tokens = 1            # it spends no tokens: the compiler is the reviewer
# A review-pool type, because it is one: it audits what `plan` answered, and
# it is the cheapest reviewer in the file -- the engine's own compiler,
# quoted back at the planner in the compiler's own words.
pool = "review"

  [[agent.result]]
  name = "steps"
  type = "int"
  required = true
  summary = "How many steps the accepted graph declares"

  [[agent.result]]
  name = "subject"
  type = "string"
  required = true
  summary = "The run whose plan was compiled"

[[agent]]
name = "explore"
kind = "specialized"
summary = "Looks at the project through Atenea's own capabilities and reports what is there"
command = "$atenea"
args = ["agent-exec", "explore"]
# The whole point of this one: it reaches code.search, symbol.* and
# repository.index through the service, so it needs the repository level and
# the history of what earlier runs of it already found.
context = ["repository", "history"]
effects = ["read"]
max_duration = "10m"      # a real model turn, not a file read
max_tokens = 200000

  [[agent.result]]
  name = "summary"
  type = "string"
  required = true
  summary = "One paragraph: what this project is and how it is arranged"

  [[agent.result]]
  name = "findings"
  type = "string"
  required = true
  summary = "What was found, in prose, naming files"

# The same agent as `explore` above, minus Atenea's capability catalog, and
# that catalog is most of what a step of this shape costs to exist. Measured
# 2026-08-15 on a real repository against claude-opus-5, cold: starting an
# `explore` turn costs $0.27 and 26,603 tokens of prefix before the model has
# read one line, and the identical probe with no tools at all costs $0.06 and
# 4,991 -- 81% of the floor is the definitions of tools most steps never call.
# On one 18-step plan that was $2.64 of a $5.29 requirement, for twelve steps
# that read files the ask had already named. Those twelve are this type.
[[agent]]
name = "reader"
kind = "specialized"
summary = "Reads files the ask already names and globs the tree; cannot search the code or query the graph, and costs about a fifth of `explore` to start"
command = "$atenea"
args = ["agent-exec", "reader"]
# The same two levels `explore` takes, and for the same reasons: the
# repository level is what resolves a relative path, and the history is what
# keeps a second run from paying to rediscover the first one's answer.
context = ["repository", "history"]
effects = ["read"]
max_duration = "10m"      # a real model turn, not a file read
max_tokens = 200000

  [[agent.result]]
  name = "summary"
  type = "string"
  required = true
  summary = "One paragraph: what this project is and how it is arranged"

  [[agent.result]]
  name = "findings"
  type = "string"
  required = true
  summary = "What was found, in prose, naming files"

[[agent]]
name = "plan"
kind = "specialized"
summary = "Reads an exploration and returns a graph of agent steps as TOML"
command = "$atenea"
args = ["agent-exec", "plan"]
# It is handed the exploration as its subject, which is an input, not an
# audit: `reads_subject` says so without putting this type in the review
# lane, where it would compete for slots sized for auditing.
reads_subject = true
# It plans from what `explore` handed it, not from a fresh look of its own:
# the exploration arrives as the subject, and re-reading the repository here
# would pay for the expensive half twice. The workspace level is what carries
# the measured cost of each agent type: a planner dividing a grant evenly
# because it has no idea what exploring costs is the failure this closes.
context = ["repository", "workspace"]
effects = ["read"]
max_duration = "10m"
max_tokens = 200000

  [[agent.result]]
  name = "plan"
  type = "string"
  required = true
  summary = "The graph, as TOML, in the format `atenea workflow create` reads"

# ---------------------------------------------------------------------------
# MCP servers: endpoints `atenea wrap` hands to a client instead of letting it
# spawn its own copy.
#
# This list is not the catalogue and nothing here answers a capability --
# Atenea reaches its own providers through adapters. It exists so that the
# declaration a client trusts is checked before the client is told about it:
# `atenea wrap opencode` handshakes every entry below and passes on only the
# ones that answered, naming the rest and why.
#
# Nothing is written to a client's config file. Launch the client without
# wrap and it is exactly as it was.
#
# Each block sets `url` OR `command`, never both, and an `id` carries no dot:
# it is one segment of the `raw.<id>.<tool>` name a passthrough would use.
#
# `expose` says which of two things a block means. `off`, the default and all
# of the above, points the client at the server and steps out of the path.
# `raw` has Atenea hold one shared connection and re-offer that server's own
# tools as `raw.<id>.<tool>`, with no funnel, no capability and no measurement
# -- a receipt is still written, saying it had no funnel. Either transport may
# be `raw`: a `url` block is one shared connection, a `command` block is one
# shared process that Atenea starts on first use and stops when it stops.
#
# A `raw` block must also declare `tools` and `effects`, and neither has a
# default. `tools` is an allow list: only those names are offered, and only
# they can be called. `effects` is what they may cause -- read, write,
# external or process -- checked against what the chat may authorize on every
# call. Atenea cannot infer either one: a backend's list can hold
# `execute_shell_command` beside `find_symbol`, and no schema says which is
# which. A raw backend is also kept out of `atenea wrap`, since pointing a
# client straight at it would route around both.
# ---------------------------------------------------------------------------
# [[mcp_server]]
# id = "serena"                        # the name the client will see
# url = "http://127.0.0.1:40010/mcp"   # http endpoint; ToolHive proxies live here
# timeout = "5s"                       # bounds the check; omitted takes the default
# expose = "off"                       # off | raw

# [[mcp_server]]
# id = "semgrep"
# url = "http://127.0.0.1:40020/mcp"
# expose = "raw"                       # Atenea holds the connection and re-offers
# tools = ["semgrep_scan"]             # required: only these are offered or callable
# effects = ["read"]                   # required: what those tools may cause
#
#   [[mcp_server.tool]]                # optional: narrower, for one tool
#   name = "semgrep_scan"
#   effects = ["read", "process"]

# [[mcp_server]]
# id = "codebase-memory"
# command = ["codebase-memory-mcp"]    # stdio server
# expose = "raw"                       # one process for every chat, instead of
#                                      # one per client: a stdio server has no
#                                      # address, so a client that is not given
#                                      # this one spawns a private copy
# tools = ["search_code", "get_architecture"]
# effects = ["read"]
# [mcp_server.env]
# CODEBASE_MEMORY_UI = "false"

# ---------------------------------------------------------------------------
# Selector rules: the user's word, above any automatic ranking.
# Omit `repository` to make a rule apply everywhere.
# ---------------------------------------------------------------------------

# [[selector.rule]]
# capability = "code.search"
# repository = "current"
# prefer = "ripgrep"
