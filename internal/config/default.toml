# Atenea settings.
#
# One file, on purpose: ceilings, rhythms and the catalog live here and
# nowhere else. Atenea is a declarative engine, so changing behavior means
# editing this file, not the core.
#
# This copy is embedded in the binary and runs when no file exists on disk. A
# file of your own replaces the catalog outright but overrides the knobs key by
# key -- a knob you delete falls back to a compiled default instead of
# disappearing, and a list you delete is not the same as a list you empty. See
# docs/content/settings.md.
#
# Conversation with the user is in Spanish; every technical artifact, this file
# included, is in English.

# Version of the core<->adapter contract this file is written against.
contract = "1.0.0"

[core]
# How long a shutdown waits for in-flight work before walking away.
shutdown_grace = "10s"

[orchestrator]
# The agent that receives a commission, explores the repositories in scope,
# splits the work into a graph of steps and hands them out.
#
# How many steps of one wave run at a time. 0 lifts the ceiling. The real brake
# is the memory of the machine, which arrives with the metrics base.
max_parallel = 4

# What ONE COMMISSION may spend, across every step and every paid provider it
# dispatches to. Money is a permission, not a cost: this is the user saying how
# much a piece of work may draw, in the same breath as saying which effects it
# may cause.
#
# The commission, not the call. A run that splits into four steps divides this
# between them and gives back what it did not use; it does not hand each of
# them a fresh one. Same trap as match_limit above, with money instead of
# matches: 0 reads as "no ceiling" and is refused, because a commission with
# nothing stopping it is a runaway. A grant that reaches zero WHILE running is
# a different thing and perfectly ordinary -- from there on the paid providers
# refuse and whoever charges nothing keeps working.
budget_usd = 0.25

# Granted, standing, to every commission and question this core dispatches --
# on top of the read that is always free. Shipped ON, not off: code.search's
# only implementations today (ripgrep, and the local stand-in) are both a
# binary, not a library, so refusing process by default would not make
# spawning one auditable, it would make the P0 capability unusable out of
# the box. What this buys is what budget_usd already buys for money: the
# grant is a line in a file the operator can read, edit or remove, not a
# yes wired silently into the binary.
effects = ["process"]

# Whether the state of a run in flight is written to disk. Memory is a
# whiteboard; disk is paper. The dump happens when a step closes and again when
# the run closes, and at no other moment.
checkpoints = true
# Empty means $XDG_STATE_HOME/atenea/runs, or ~/.local/state/atenea/runs.
checkpoint_dir = ""

# Who actually executes a step: any of "omp", "claudecode", "serena" and
# "local".
#
# Atenea decides and delegates, so execution always happens on the far side of
# this line, and that far side is an adapter: a dumb translator with no logic
# of its own. It is a list because omp and Claude Code are both first-class
# clients and can be attached at once; each answers for its own
# implementations, and two of them claiming the same one is refused at load.
#
# "omp" is the adapter that ships. "claudecode" drives the Claude Code CLI and
# is off by default because it costs money per call. "serena" is not a CLI at
# all: it is an MCP server, attached the same way because a capability does not
# care whether its provider is a command or a server. "local" is a stand-in
# that searches the disk directly, for a machine with no client installed. An
# empty list leaves the core able to plan and choose, with nothing to dispatch.
runners = ["omp"]

  [orchestrator.omp]
  # The omp executable. A bare name is looked up on PATH, which is the normal
  # case; a full path covers an install somewhere unusual.
  binary = "omp"
  # Implementations the adapter answers for. Anything else it is handed comes
  # back as unavailable, which is the bin that drives fallback.
  implementations = ["ripgrep"]
  # How many matches one search asks omp for.
  #
  # omp always caps. Its own zero is not "no limit": it falls back to a small
  # internal default and then reports the short answer as if it were complete,
  # so Atenea always states the number instead and says out loud when a search
  # reached it.
  match_limit = 10000
  # How long one omp call may take before it is treated as stuck rather than
  # slow. The timeout bin is what lets the core fall back instead of waiting.
  timeout = "30s"

  [orchestrator.claudecode]
  # The claude executable. A bare name is looked up on PATH.
  binary = "claude"
  # Implementations the adapter answers for. This is a different id from
  # ripgrep's on purpose: the same question answered by a model is not the same
  # answer at the same price, and the funnel has to be able to tell them apart.
  implementations = ["claude.search"]
  # This adapter has no ceiling of its own. What a call may spend arrives with
  # the commission, from budget_usd under [orchestrator] above -- money is a
  # permission, and permissions are granted per commission.
  #
  # How long one call may take. A model turn is slower than a tool call by
  # nature, so this sits above omp's ceiling; past it the turn is stuck rather
  # than thinking, and the timeout bin is what lets the core fall back.
  #
  # Ninety seconds, not the five minutes this used to be. Measured: two real
  # searches against a mid-sized repository made 8 and 9 turns in 55s and 66s
  # -- about seven seconds a turn -- and BOTH were ended by budget_usd, not by
  # time. Five minutes was a leash nothing ever reached, and far longer than
  # anybody waiting at a prompt will sit through. This is ~13 turns of room.
  #
  # It does not overlap with budget_usd: money stops a client working too
  # expensively, this stops one that is not working at all. A client wedged on
  # a lock spends nothing, so no grant will ever end it.
  timeout = "90s"

  [orchestrator.serena]
  # Where Serena is listening. It runs as an MCP server behind a local proxy
  # rather than as a command, so this is a URL and not a binary. The port is
  # whatever the proxy was told to bind; leaving it unpinned is how you end up
  # with a URL that works until the next restart.
  #
  # The host is a literal address and NOT `localhost`, deliberately. The proxy
  # binds 127.0.0.1 -- IPv4, and only IPv4 -- while `localhost` is a name whose
  # answer belongs to the machine, not to Atenea. The day it resolves ::1 first,
  # which is the default nearly everywhere and arrives on its own with a
  # resolver update, a name here would start refusing connections with nothing
  # on this side having changed. An address cannot be reinterpreted.
  # See docs/content/diagnosing-providers.md.
  endpoint = "http://127.0.0.1:40010/mcp"
  # Implementations the adapter answers for. serena.search is deliberately NOT
  # here: this adapter is wired for the symbol capabilities, and claiming a
  # text search it has no code for would make the funnel promise an answer
  # nobody can give.
  implementations = ["serena.definition", "serena.references", "serena.implementations", "serena.overview"]
  # How long one call may take. A language server that has to index a cold
  # repository is slow long before it is stuck, so this sits above omp's
  # ceiling and well below a model turn's.
  timeout = "90s"

  # [orchestrator.serena.process]
  # Uncomment to have Atenea launch and supervise Serena itself as a bare
  # process instead of assuming it is already running at endpoint above --
  # no ToolHive, no container, no proxy started by hand. Atenea starts it,
  # watches it over the same MCP wire it serves on, and restarts it a
  # bounded number of times if it crashes, exactly like the break-in
  # rotation this design already applies to providers.
  #
  # command = "serena"
  # args = ["start-mcp-server", "--transport", "streamable-http", "--port", "{{port}}"]
  # {{port}} is replaced with the chosen port before every spawn.
  #
  # "persistent" warms it up with Atenea and keeps it running throughout;
  # "on_demand" starts it on first use and stops it once nothing has asked
  # for it in a while. There is no default -- pick the one that matches how
  # steadily this machine actually uses Serena.
  # lifecycle = "on_demand"
  #
  # Port 0 (the default, and generally the right choice) asks the OS for a
  # free one; a fixed number is only worth pinning if something else on this
  # machine needs to find Serena at a stable address.
  # port = 0
  #
  # The rest tune crash recovery and all take the supervisor package's own
  # defaults when left out: restart_limit, restart_delay, stable_after,
  # ready_timeout, stop_grace.
  #
  # idle_timeout is the exception: it is how long an idle server may sit
  # before it is stopped, so it belongs to "on_demand" alone. Writing it
  # beside "persistent" is refused rather than ignored -- nothing about a
  # persistent server would ever have shown you it was doing nothing.

  [orchestrator.codebasememory]
  # The codebase-memory-mcp executable. A bare name is looked up on PATH.
  binary = "codebase-memory-mcp"
  # Implementations the adapter answers for. codebase-memory.search below is
  # deliberately NOT here: that catalog entry stays an unimplemented
  # possibility, on purpose, until something actually claims code.search from
  # this graph. This adapter is wired for the two capabilities that read the
  # call graph itself -- symbol.calls and code.impact -- and for the one that
  # writes what they read: repository.index. Claiming a text search it has no
  # code path for would make the funnel promise an answer nobody can give.
  implementations = ["codebase-memory.calls", "codebase-memory.impact", "codebase-memory.index"]
  # How long one codebase-memory-mcp or git invocation may take. It sits at
  # Serena's own ceiling: both open an index before they can answer, and a
  # cold one is slow long before it is stuck.
  timeout = "90s"

  [orchestrator.local]
  # Implementations the stand-in answers for.
  implementations = ["ripgrep"]
  # Directories never descended into. A real search tool skips these by reading
  # .gitignore; the stand-in does not read it, so it is told instead.
  skip_dirs = [".git", "node_modules", "vendor", "dist", "build", ".venv", "target"]

[metrics]
# The measurement base: what every attempt cost, on three axes -- time, tokens
# and memory -- filed under the capability asked for and the implementation
# that answered. It is the fuel the funnel will rank on. Until it has real
# figures the funnel ranks on the estimates written further down this file,
# which is guesswork wearing a decimal point.
#
# Turning it off leaves a working core that never learns what anything costs.
enabled = true
# Empty means $XDG_STATE_HOME/atenea/metrics.duckdb, beside the run receipts.
# One embedded file, written by the core and nobody else.
path = ""

# The two rhythms, both served by the one clock so they cannot collide.
#
# Writes are batched: a measurement waits in memory and reaches the disk on the
# beat below. Two moments do not wait for it -- a phase closing and the process
# going down -- so this is the rhythm between them, not the guarantee.
flush = "30s"
# How often the retention ladder is walked: attempts are folded into hours,
# hours into days after a week, days into weeks after a month, weeks into
# months after six. There is always fine detail about the recent past and only
# shapes about the distant one.
compact = "1h"

# How many measurements may wait in memory when writes are failing -- another
# Atenea holding the file, a full disk. Past the ceiling the oldest are dropped
# and counted, because the only thing worse than losing a measurement is not
# knowing that you did. Empty means 10000.
# buffer_limit = 10000

[backup]
# What protects the history. The measurement base, the run receipts and the
# crash notebook are everything Atenea has learned; a disk that loses them
# loses the reason the funnel picks anybody.
#
# Copies are incremental in the only way compatible with dropping the oldest
# one: a file that has not changed is hard-linked to the copy before it, so it
# costs no bytes, and every snapshot stays a complete tree you can restore on
# its own. A chain of deltas would be smaller and would collapse the day the
# rotation removed the base of the chain.
enabled = true
# Empty means a folder of its own BESIDE the state root, never inside it: a
# copy under the tree it copies recurses into itself, and dies with the tree it
# exists to survive. Point this at another disk and it becomes a real backup.
dir = ""
# The rhythm, served by the same clock as the flush and the compaction above so
# the three cannot come due at once and fight over the disk. It is read from
# what is on disk, not from a timer in memory: a service that restarts more
# often than this would otherwise never copy anything at all.
every = "6h"
# How many copies survive. The sixth arrives, the oldest leaves.
keep = 5

[security]
# The files that carry secrets inside them. Reading is free by default, and
# this list is the exception. While exploring, a match here is skipped in
# silence: stopping to ask would break the flow, and writing the skip down
# would cost more than ignoring it is worth.
#
# Deleting this block does NOT disarm the guard, it restores these defaults.
# To have no sensitive files at all, write an explicit empty list.
sensitive = [
  ".env",
  ".env.*",
  ".npmrc",
  ".netrc",
  "*.pem",
  "*.key",
  "*.p12",
  "id_rsa",
  "id_ed25519",
  "*credentials*.json",
  "*service-account*.json",
]

# ---------------------------------------------------------------------------
# Capabilities: the stable "what". Agnostic of any tool, by definition.
# ---------------------------------------------------------------------------

[[capability]]
id = "code.search"
version = "1.0.0"
summary = "Find literal text in a repository without understanding the code."
semantics = """
Flat text search. The engine behind it does not need to parse anything: this is \
the ripgrep-shaped capability, not the symbol-shaped one. Options are stated as \
INTENT, never as a technical order, so the capability is not married to any one \
engine. Snippets carry two lines of context above and below unless the caller \
asks for more.\
"""
effects = ["read", "process"]

  [[capability.input]]
  name = "query"
  type = "string"
  required = true
  summary = "The text to look for."

  [[capability.input]]
  name = "scope"
  type = "string_list"
  required = false
  summary = "Paths to search: the repository, a folder or a single file. Empty means the whole repository."

  [[capability.input]]
  name = "match_case"
  type = "bool"
  required = false
  summary = "Intent: distinguish upper from lower case."

  [[capability.input]]
  name = "regex"
  type = "bool"
  required = false
  summary = "Intent: read the query as a pattern rather than as literal text."

  [[capability.input]]
  name = "whole_word"
  type = "bool"
  required = false
  summary = "Intent: match whole words only."

  [[capability.input]]
  name = "file_types"
  type = "string_list"
  required = false
  summary = "Intent: restrict the search to these file types."

  [[capability.input]]
  name = "context_lines"
  type = "int"
  required = false
  summary = "Lines of context around each match. Defaults to 2 above and 2 below."

  [[capability.output]]
  name = "matches"
  type = "record_list"
  required = true
  summary = "Every hit, in the order the engine found them."

    [[capability.output.field]]
    name = "path"
    type = "string"
    required = true
    summary = "File containing the match, relative to the repository root."

    [[capability.output.field]]
    name = "line"
    type = "int"
    required = true
    summary = "Line number of the match, starting at 1."

    [[capability.output.field]]
    name = "column"
    type = "int"
    required = true
    summary = "Column where the match starts, starting at 1."

    [[capability.output.field]]
    name = "snippet"
    type = "string"
    required = false
    summary = "The matching line with its surrounding context."

[[capability]]
id = "symbol.definition"
version = "1.0.0"
summary = "From a symbol, find the one place where it is born."
semantics = """
Where a symbol is DEFINED, not where it is mentioned -- that second question is \
code.search's, and answering this one with a text match would be a different \
answer wearing the same name. The symbol is given by POSITION: a workspace of \
forty repositories holds the same name many times over, and a position is \
unambiguous where a name is not. The name is a hint -- it breaks a tie and it \
makes the request readable -- and an implementation may ignore it. The location \
always comes back; the fragment only when asked, so a caller that needs to read \
the definition does not pay a second round trip for it.\
"""
effects = ["read"]

  [[capability.input]]
  name = "file"
  type = "string"
  required = true
  summary = "File holding the symbol, relative to the repository root."

  [[capability.input]]
  name = "line"
  type = "int"
  required = true
  summary = "Line where the symbol appears, starting at 1."

  [[capability.input]]
  name = "column"
  type = "int"
  required = true
  summary = "Column where the symbol starts on that line, starting at 1."

  [[capability.input]]
  name = "name"
  type = "string"
  required = false
  summary = "Hint: the symbol's name, for tie-breaking and for reading the request."

  [[capability.input]]
  name = "include_snippet"
  type = "bool"
  required = false
  summary = "Intent: return the definition itself, not only where it is."

  [[capability.input]]
  name = "snippet_lines"
  type = "int"
  required = false
  summary = "How much of the definition to return. Small by default, on purpose."

  [[capability.output]]
  name = "location"
  type = "record"
  required = true
  summary = "Where the symbol is defined."

    [[capability.output.field]]
    name = "path"
    type = "string"
    required = true
    summary = "File holding the definition, relative to the repository root."

    [[capability.output.field]]
    name = "line"
    type = "int"
    required = true
    summary = "Line where the definition starts, starting at 1."

    [[capability.output.field]]
    name = "snippet"
    type = "string"
    required = false
    summary = "The definition itself, present only when it was asked for."

[[capability]]
id = "symbol.references"
version = "1.0.0"
summary = "From a symbol, find every place it is used."
semantics = """
Every site that USES or mentions the symbol, which is the opposite direction \
from symbol.definition and inherits its way of naming one: position first, name \
as a hint. The one thing it adds is scope, and it is not decoration -- with \
forty repositories a question asked without one drowns the caller in hundreds \
of hits. Empty scope means the whole repository, deliberately, so the default \
is honest rather than quietly narrow.\
"""
effects = ["read"]

  [[capability.input]]
  name = "file"
  type = "string"
  required = true
  summary = "File holding the symbol, relative to the repository root."

  [[capability.input]]
  name = "line"
  type = "int"
  required = true
  summary = "Line where the symbol appears, starting at 1."

  [[capability.input]]
  name = "column"
  type = "int"
  required = true
  summary = "Column where the symbol starts on that line, starting at 1."

  [[capability.input]]
  name = "name"
  type = "string"
  required = false
  summary = "Hint: the symbol's name, for tie-breaking and for reading the request."

  [[capability.input]]
  name = "scope"
  type = "string_list"
  required = false
  summary = "Paths to look in. Empty means the whole repository."

  [[capability.input]]
  name = "include_snippet"
  type = "bool"
  required = false
  summary = "Intent: return the line at each use site, not only where it is."

  [[capability.input]]
  name = "snippet_lines"
  type = "int"
  required = false
  summary = "How much to return around each use. Small by default, on purpose."

  [[capability.output]]
  name = "locations"
  type = "record_list"
  required = true
  summary = "Every place the symbol is used, in the order the provider found them."

    [[capability.output.field]]
    name = "path"
    type = "string"
    required = true
    summary = "File holding the use, relative to the repository root."

    [[capability.output.field]]
    name = "line"
    type = "int"
    required = true
    summary = "Line of the use, starting at 1."

    [[capability.output.field]]
    name = "snippet"
    type = "string"
    required = false
    summary = "The line at the use site, present only when it was asked for."

[[capability]]
id = "symbol.implementations"
version = "1.0.0"
summary = "From something abstract, find who really implements it."
semantics = """
Given an interface or an overridable method, the concrete implementations \
behind it. Same mould as symbol.references down to the last field, because the \
question is shaped the same way and only its meaning changes: not who mentions \
this, but who fulfils it. Asking it of something concrete is not an error, it \
is an empty answer.\
"""
effects = ["read"]

  [[capability.input]]
  name = "file"
  type = "string"
  required = true
  summary = "File holding the symbol, relative to the repository root."

  [[capability.input]]
  name = "line"
  type = "int"
  required = true
  summary = "Line where the symbol appears, starting at 1."

  [[capability.input]]
  name = "column"
  type = "int"
  required = true
  summary = "Column where the symbol starts on that line, starting at 1."

  [[capability.input]]
  name = "name"
  type = "string"
  required = false
  summary = "Hint: the symbol's name, for tie-breaking and for reading the request."

  [[capability.input]]
  name = "scope"
  type = "string_list"
  required = false
  summary = "Paths to look in. Empty means the whole repository."

  [[capability.input]]
  name = "include_snippet"
  type = "bool"
  required = false
  summary = "Intent: return the line at each implementation, not only where it is."

  [[capability.input]]
  name = "snippet_lines"
  type = "int"
  required = false
  summary = "How much to return around each implementation. Small by default."

  [[capability.output]]
  name = "locations"
  type = "record_list"
  required = true
  summary = "Every concrete implementation, in the order the provider found them."

    [[capability.output.field]]
    name = "path"
    type = "string"
    required = true
    summary = "File holding the implementation, relative to the repository root."

    [[capability.output.field]]
    name = "line"
    type = "int"
    required = true
    summary = "Line where the implementation starts, starting at 1."

    [[capability.output.field]]
    name = "snippet"
    type = "string"
    required = false
    summary = "The line at the implementation, present only when it was asked for."

[[capability]]
id = "symbol.overview"
version = "1.0.0"
summary = "What a file declares, without knowing any of it by name first."
semantics = """
The entry move into an unfamiliar file: every symbol it declares, before \
anything in it can be asked about by name or position. Every other symbol.* \
capability needs one of those handed to it; this is the one that hands it \
back. Depth controls how far to descend into nested symbols -- a struct's \
fields, for languages that have them -- with 0, the default, listing only \
what the file declares at its own top level. Line and column both come back, \
and both are real positions, not a hint: line is what the provider reports, \
column is recovered by finding the symbol's own name as a whole word on that \
line, because no provider behind this capability ever reports one itself.\
"""
effects = ["read"]

  [[capability.input]]
  name = "file"
  type = "string"
  required = true
  summary = "File to list, relative to the repository root."

  [[capability.input]]
  name = "depth"
  type = "int"
  required = false
  summary = "How many levels of nesting to descend into (a struct's fields, for example). 0 by default."

  [[capability.output]]
  name = "symbols"
  type = "record_list"
  required = true
  summary = "Every symbol the file declares, in the order the provider found them."

    [[capability.output.field]]
    name = "name"
    type = "string"
    required = true
    summary = "The symbol's own name."

    [[capability.output.field]]
    name = "kind"
    type = "string"
    required = true
    summary = "The provider's own name for what kind of symbol this is (function, struct, method, ...)."

    [[capability.output.field]]
    name = "line"
    type = "int"
    required = true
    summary = "Line where the symbol starts, starting at 1."

    [[capability.output.field]]
    name = "column"
    type = "int"
    required = true
    summary = "Column where the symbol's name starts on that line, starting at 1."

    [[capability.output.field]]
    name = "end_line"
    type = "int"
    required = false
    summary = "Line where the symbol's body ends, starting at 1. Absent for a symbol that fits on one line, where it would only repeat line."

    [[capability.output.field]]
    name = "parent"
    type = "string"
    required = false
    summary = "Name of the enclosing symbol, when this one is nested (depth > 0)."

[[capability]]
id = "symbol.calls"
version = "1.0.0"
summary = "From a symbol, walk the call graph in a chosen direction."
semantics = """
Where a symbol sits on the CALL graph, not everywhere it is mentioned -- that is \
symbol.references's question, and a call is one narrow kind of mention among the \
many it does not separate out. Position and the name hint are inherited from the \
same family. Direction is not guessed: incoming and outgoing are different \
questions with different answers, so the caller states which one, or both. Depth \
bounds how far the walk goes, small by default, because a workspace of many \
repositories turns an unbounded walk into hundreds of hits before anyone asked \
for that many. Unlike a reference, a call names a DIFFERENT symbol -- the one \
calling in, or the one being called out to -- so every result carries its own \
name and its own distance from the symbol asked about, not only where it sits.\
"""
effects = ["read"]

  [[capability.input]]
  name = "file"
  type = "string"
  required = true
  summary = "File holding the symbol, relative to the repository root."

  [[capability.input]]
  name = "line"
  type = "int"
  required = true
  summary = "Line where the symbol appears, starting at 1."

  [[capability.input]]
  name = "column"
  type = "int"
  required = true
  summary = "Column where the symbol starts on that line, starting at 1."

  [[capability.input]]
  name = "name"
  type = "string"
  required = false
  summary = "Hint: the symbol's name, for tie-breaking and for reading the request."

  [[capability.input]]
  name = "direction"
  type = "string"
  required = true
  summary = "Which way to walk: \"incoming\" (who calls this), \"outgoing\" (what this calls), or \"both\"."

  [[capability.input]]
  name = "scope"
  type = "string_list"
  required = false
  summary = "Paths to look in. Empty means the whole repository."

  [[capability.input]]
  name = "depth"
  type = "int"
  required = false
  summary = "How many hops to follow. Small by default, on purpose."

  [[capability.input]]
  name = "include_snippet"
  type = "bool"
  required = false
  summary = "Intent: return the line at each call, not only where it is."

  [[capability.input]]
  name = "snippet_lines"
  type = "int"
  required = false
  summary = "How much to return around each call. Small by default, on purpose."

  [[capability.output]]
  name = "calls"
  type = "record_list"
  required = true
  summary = "Every call found, nearest hop first."

    [[capability.output.field]]
    name = "path"
    type = "string"
    required = true
    summary = "File holding the call, relative to the repository root."

    [[capability.output.field]]
    name = "line"
    type = "int"
    required = true
    summary = "Line of the call, starting at 1."

    [[capability.output.field]]
    name = "name"
    type = "string"
    required = true
    summary = "The name of the symbol found at this hop."

    [[capability.output.field]]
    name = "direction"
    type = "string"
    required = true
    summary = "Whether this result was found walking \"incoming\" or \"outgoing\" from the symbol asked about."

    [[capability.output.field]]
    name = "depth"
    type = "int"
    required = true
    summary = "How many hops from the symbol asked about, starting at 1."

    [[capability.output.field]]
    name = "snippet"
    type = "string"
    required = false
    summary = "The line at the call, present only when it was asked for."

[[capability]]
id = "code.impact"
version = "1.0.0"
summary = "From a change, find what it reaches."
semantics = """
What a change reaches, not merely what it touched -- touched is the easy half, \
the list of files different from the baseline, and it comes back too because the \
graph answer is unreadable without it. The hard half is everything that calls \
into what changed and would feel it: this is symbol.calls, asked once for every \
symbol the change actually touched instead of once by hand for each. A directly \
changed symbol is simply the zero-distance entry -- no separate flag marks it, \
because depth already says so. baseline names the far side of the comparison as \
intent, a point in the repository's history to measure the current state \
against, the same reason code.search's options are intent and not one version \
control system's own syntax. depth bounds the walk the same way and for the same \
reason as its sibling's.\
"""
effects = ["read"]

  [[capability.input]]
  name = "baseline"
  type = "string"
  required = true
  summary = "A point in the repository's history to compare the current state against."

  [[capability.input]]
  name = "scope"
  type = "string_list"
  required = false
  summary = "Paths to narrow which changed files count. Empty means every file the baseline changed."

  [[capability.input]]
  name = "depth"
  type = "int"
  required = false
  summary = "How many hops of the call graph to follow out from each changed symbol. Small by default, on purpose."

  [[capability.input]]
  name = "include_snippet"
  type = "bool"
  required = false
  summary = "Intent: return the line at each affected symbol, not only where it is."

  [[capability.input]]
  name = "snippet_lines"
  type = "int"
  required = false
  summary = "How much to return around each affected symbol. Small by default, on purpose."

  [[capability.output]]
  name = "changed_files"
  type = "string_list"
  required = true
  summary = "Every file different from the baseline, relative to the repository root."

  [[capability.output]]
  name = "affected_symbols"
  type = "record_list"
  required = true
  summary = "Every symbol the change reaches, nearest first."

    [[capability.output.field]]
    name = "path"
    type = "string"
    required = true
    summary = "File holding the symbol, relative to the repository root."

    [[capability.output.field]]
    name = "line"
    type = "int"
    required = true
    summary = "Line where the symbol starts, starting at 1."

    [[capability.output.field]]
    name = "name"
    type = "string"
    required = true
    summary = "The symbol's name."

    [[capability.output.field]]
    name = "kind"
    type = "string"
    required = false
    summary = "The provider's own name for what kind of symbol this is (function, struct, route, ...), when it reports one."

    [[capability.output.field]]
    name = "depth"
    type = "int"
    required = true
    summary = "How many hops from a directly changed symbol, starting at 0 for the changed symbol itself."

    [[capability.output.field]]
    name = "snippet"
    type = "string"
    required = false
    summary = "The line at the symbol, present only when it was asked for."

[[capability]]
id = "repository.index"
version = "1.0.0"
summary = "Build or refresh a provider's index for a repository."
semantics = """
Detection reads a provider's own claim about a repository; this capability \
is what gives it a claim to read. A repository nothing has ever indexed \
answers detection truthfully as "not ready" forever, because looking harder \
never builds what was never there -- something has to actually run the \
tool that walks the repository and writes the graph, and that is this. \
\
It is deliberately its own capability and not a mode of any read one: \
building writes to disk and spawns a process that can run for minutes on a \
large repository, which is exactly the action detection itself must never \
take silently on a caller's behalf. mode is intent, not a provider's own \
vocabulary -- how thorough the build should be, coarse enough that a \
provider without the concept can simply ignore it -- the same reasoning \
code.search's own options already follow.\
"""
effects = ["write", "process"]

  [[capability.input]]
  name = "mode"
  type = "string"
  required = false
  summary = "How thorough the index should be: \"fast\", \"moderate\" or \"full\" (default: the provider's own)."

  [[capability.output]]
  name = "status"
  type = "string"
  required = true
  summary = "What the provider reports when indexing finishes, in its own words."

  [[capability.output]]
  name = "nodes"
  type = "int"
  required = true
  summary = "How many graph nodes the index now holds."

  [[capability.output]]
  name = "edges"
  type = "int"
  required = true
  summary = "How many graph edges the index now holds."

# ---------------------------------------------------------------------------
# Implementations: the "who and how". Four blocks each -- capability,
# constraints, cost and health.
#
# Health starts unknown for everyone: nothing has been probed yet. Declare a
# state here to take a provider out of the running by hand; once the health
# checker exists, live probes own this value.
# ---------------------------------------------------------------------------

[[implementation]]
id = "ripgrep"
provider = "ripgrep"
capability = "code.search"
scope_guarantee = "confined"   # targets() refuses any path outside scope before ripgrep ever runs

  [implementation.constraints]
  languages = []          # agnostic: it does not parse anything
  requires_index = false
  min_scale = ""
  max_scale = ""

  [implementation.cost]
  estimated_duration = "80ms"
  estimated_tokens = 400

[[implementation]]
id = "serena.search"
provider = "serena"
capability = "code.search"

  [implementation.constraints]
  languages = ["go", "typescript", "javascript", "python", "java", "rust", "php", "csharp"]
  requires_index = true
  min_scale = ""
  max_scale = ""

  [implementation.cost]
  estimated_duration = "600ms"
  estimated_tokens = 900

[[implementation]]
id = "codebase-memory.search"
provider = "codebase-memory"
capability = "code.search"

  [implementation.constraints]
  languages = []
  requires_index = true
  min_scale = "medium"    # the graph only pays for itself on a big repository
  max_scale = ""

  [implementation.cost]
  estimated_duration = "1.2s"
  estimated_tokens = 700

[[implementation]]
id = "claude.search"
provider = "claude-code"
capability = "code.search"
scope_guarantee = "filtered"   # the model is only asked nicely; every returned match is checked against scope afterward and dropped if it strays

  [implementation.constraints]
  languages = []          # a model reads whatever it is shown
  requires_index = false
  min_scale = ""
  max_scale = ""

  [implementation.cost]
  # Two orders of magnitude above ripgrep on both axes, and that is the point:
  # the funnel is cost-aware, so declaring this honestly is what keeps a model
  # from being chosen for work a tool already does well. It wins when the
  # cheaper providers are unhealthy or cannot work here at all.
  estimated_duration = "12s"
  estimated_tokens = 20000

# The three symbol implementations share a provider, and therefore share an
# index and a language list. Serena drives a language server per language: it
# understands only the ones it has a server for, and it is useless on a
# repository it has not indexed. Both facts are constraints, so both live here
# and not in the capability -- a capability that grew a language list would
# stop being swappable, which is the whole point of having one.
#
# The cost of all three is one activation plus two round trips: the adapter
# turns the position the capability speaks into the name path Serena speaks,
# and it asks Serena itself to do it rather than parsing code on its own.

[[implementation]]
id = "serena.definition"
provider = "serena"
capability = "symbol.definition"

  [implementation.constraints]
  languages = ["go", "typescript", "javascript", "python", "java", "rust", "php", "csharp"]
  requires_index = true
  min_scale = ""
  max_scale = ""

  [implementation.cost]
  estimated_duration = "700ms"
  estimated_tokens = 500

[[implementation]]
id = "serena.references"
provider = "serena"
capability = "symbol.references"

  [implementation.constraints]
  languages = ["go", "typescript", "javascript", "python", "java", "rust", "php", "csharp"]
  requires_index = true
  min_scale = ""
  max_scale = ""

  [implementation.cost]
  # Dearer than a definition: one answer versus every use site in the scope.
  estimated_duration = "1.5s"
  estimated_tokens = 1200

[[implementation]]
id = "serena.implementations"
provider = "serena"
capability = "symbol.implementations"

  [implementation.constraints]
  languages = ["go", "typescript", "javascript", "python", "java", "rust", "php", "csharp"]
  requires_index = true
  min_scale = ""
  max_scale = ""

  [implementation.cost]
  estimated_duration = "1.5s"
  estimated_tokens = 1200

[[implementation]]
id = "serena.overview"
provider = "serena"
capability = "symbol.overview"

  [implementation.constraints]
  languages = ["go", "typescript", "javascript", "python", "java", "rust", "php", "csharp"]
  requires_index = true
  min_scale = ""
  max_scale = ""

  [implementation.cost]
  # One overview call plus one find_symbol per name it reports, capped at 16
  # in flight together. Measured against this repository's own largest file
  # at nested depth (91 symbols): 392-630ms across eighteen live runs in two
  # independent sessions, returning ~6.5-7.5KB depending on JSON spacing
  # (~1700-1900 tokens); the estimate below rounds to the top of both ranges
  # rather than the middle, because a funnel that under-promises cost picks
  # this over a cheaper provider it should have lost to. Explicitly checked
  # for the cold tax other implementations on this page only guess at: two
  # serena.service restarts, each followed immediately by a call against the
  # same file, showed no measurable gap against calls already warm (514ms
  # and 502ms cold, inside the ordinary spread) -- for a repository this
  # size, get_symbols_overview and find_symbol are cheap enough that
  # gopls's own indexing is not the bottleneck this estimate needs to cover.
  estimated_duration = "700ms"
  estimated_tokens = 1900

# codebase-memory answers both of these from the same call graph
# codebase-memory.search above would open, if anything ever claimed it -- no
# second index, no second provider concept, just two more questions the one
# graph can answer.

[[implementation]]
id = "codebase-memory.calls"
provider = "codebase-memory"
capability = "symbol.calls"

  [implementation.constraints]
  languages = []
  requires_index = true
  min_scale = "medium"    # the graph only pays for itself on a big repository
  max_scale = ""

  [implementation.cost]
  estimated_duration = "900ms"
  estimated_tokens = 600

[[implementation]]
id = "codebase-memory.impact"
provider = "codebase-memory"
capability = "code.impact"

  [implementation.constraints]
  languages = []
  requires_index = true
  requires_vcs = true     # walks a git diff against baseline; needs a repository under version control
  min_scale = "medium"
  max_scale = ""

  [implementation.cost]
  # Dearer than a single call-graph walk: one git diff plus one graph walk
  # per directly changed symbol, so cost scales with how much a commission
  # actually touched instead of staying flat like the others.
  estimated_duration = "2.5s"
  estimated_tokens = 1500

[[implementation]]
id = "codebase-memory.index"
provider = "codebase-memory"
capability = "repository.index"

  # Unrestricted on purpose, unlike its read-only siblings above: a small
  # repository the funnel would never pick this implementation for on a
  # *read* still has to be reachable for an explicit *build* -- that is the
  # whole path out of the false negative detection alone cannot fix.
  [implementation.constraints]
  languages = []
  requires_index = false  # this is how one gets built
  min_scale = ""
  max_scale = ""

  [implementation.cost]
  # A whole-repository walk, not one query against a graph already built --
  # measured at 0.5s / 2294 nodes on this repository's own source, cold
  # cache. Above codebase-memory.impact's own ceiling on purpose: this is
  # the expensive one, and mode="full" on a much larger repository would
  # spend more still.
  estimated_duration = "3s"
  # The answer is three scalars, not a list -- the one implementation here
  # whose token cost barely depends on repository size at all.
  estimated_tokens = 60

# ---------------------------------------------------------------------------
# Repositories: the unit of work. Not the project -- the repository.
# ---------------------------------------------------------------------------

[[repository]]
id = "current"
path = "."
languages = ["go"]
scale = "small"
vcs = ""                  # unknown until declared; unspecified never disqualifies (pkg/contract/implementation.go)
indexed_by = []           # providers holding a ready index for this repository
