  type = "record_list"
  required = true
  summary = "The one symbol the key names, as a single-row list, or empty if the key is unknown."

    [[capability.output.field]]
    name = "path"
    type = "string"
    required = true
    summary = "File where the symbol is declared, relative to the repository root."

    [[capability.output.field]]
    name = "line"
    type = "int"
    required = true
    summary = "Line of the declaration, starting at 1."

    [[capability.output.field]]
    name = "name"
    type = "string"
    required = true
    summary = "The symbol's own name."

    [[capability.output.field]]
    name = "kind"
    type = "string"
    required = true
    summary = "The kind of symbol, in the graph's own vocabulary."

[[capability]]
id = "symbol.unresolved"
version = "1.0.0"
summary = "List the references that resolve to no exact symbol."
semantics = """
The graph's blind spots, not its edges: references it recorded but could not tie to a \
