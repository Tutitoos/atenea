  required = true
  summary = "Which application was captured."

  [[capability.output]]
  name = "bundle_id"
  type = "string"
  required = true
  summary = "That application's bundle identifier."

  [[capability.output]]
  name = "untrusted"
  type = "bool"
  required = true
  summary = "Always true: this is whatever that window chose to display."

  [[capability.output]]
