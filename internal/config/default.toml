  [[capability.input]]
  name = "mode"
  type = "string"
  required = false
  summary = "How thorough the index should be: \"fast\", \"moderate\" or \"full\" (default: the provider's own)."
  enum = ["fast", "moderate", "full"]

  [[capability.output]]
  name = "status"
  type = "string"
  required = true
  summary = "What the provider reports when indexing finishes, in its own words."

  [[capability.output]]
  name = "nodes"
  type = "int"
  required = true
  summary = "How many graph nodes the index now holds."

  [[capability.output]]
  name = "edges"
  type = "int"
  required = true
  summary = "How many graph edges the index now holds."

# ---------------------------------------------------------------------------
# Kivgraph capabilities. Four answers no attached provider gives today.
#
# Why Kivgraph does NOT appear under symbol.definition / references /
# implementations / overview / calls, or code.impact: serena and
# codebase-memory already answer those, and a second implementation would not
# add an answer -- it would rank two providers for one the funnel already has,
# and cost +1,688 tok in every fixed-prefix client's request, forever, for a
# duplicate. Kivgraph is declared ONLY for what it alone resolves: consumers
# across repositories (a real edge, not a path-shape match), the stable-key
# identity retrieval the position-first family cannot do, the graph's own
# unresolved-reference blind spots, and the published graph's provenance.
# ---------------------------------------------------------------------------

[[capability]]
id = "symbol.consumers"
version = "1.0.0"
summary = "From a symbol, find who consumes it from other repositories."
semantics = """
Resolved cross-repository consumers of one symbol, sorted into exact_symbol, package, \
candidate and unresolved -- an edge the graph actually resolved, not two files that \
share a path. Position first, name as a hint, as symbol.references names one; a caller \
holding only a name asks symbol.definition first. Neither a language server (one \
repository) nor a path-shape match (a guess) can give this. \
\
A package row is not an exact_symbol row read loosely: it proves the consuming \
repository depends on the provider PACKAGE, never that it uses this symbol, and it \
carries no path for exactly that reason. Counting it as a use nobody observed is the \
one mistake this shape invites. \
\
Answering from a position costs one extra lookup inside the provider: Kivgraph \
addresses symbols by a stable key, not by position, so the implementation resolves \
file/line/column to that key before it can ask the graph anything. That lookup is the \
provider's own cost, never this capability's -- callers still pay in file and line, \
the same currency every other position-first capability on this page takes, and never \
in a key that only this one provider could ever mint.\
"""
effects = ["read"]

  [[capability.input]]
  name = "file"
  type = "string"
  required = true
  summary = "File holding the symbol, relative to the repository root."

  [[capability.input]]
  name = "line"
  type = "int"
  required = true
  summary = "Line where the symbol appears, starting at 1."

  [[capability.input]]
  name = "column"
  type = "int"
  required = true
  summary = "Column where the symbol starts on that line, starting at 1."

  [[capability.input]]
  name = "name"
  type = "string"
  required = false
  summary = "Hint: the symbol's name, for tie-breaking and for reading the request."

  [[capability.input]]
  name = "resolution"
  type = "string"
  required = false
  summary = "Narrow to one class: exact_symbol, package, candidate or unresolved. Empty means all four."

  [[capability.output]]
  name = "consumers"
  type = "record_list"
  required = true
  summary = "Consumers in other repositories, grouped by resolution class."

    [[capability.output.field]]
    name = "repository"
    type = "string"
    required = true
    summary = "The consuming repository."

    [[capability.output.field]]
    name = "path"
    type = "string"
    required = false
    summary = "File holding the consuming reference, relative to that repository's root. Empty for a package-level consumer, which names a dependency on the package and never a use of the symbol."

    [[capability.output.field]]
    name = "resolution"
    type = "string"
    required = true
    summary = "How firmly it resolved: exact_symbol, package, candidate or unresolved."
    enum = ["exact_symbol", "package", "candidate", "unresolved"]

[[capability]]
id = "symbol.get"
version = "1.0.0"
summary = "Return one symbol by its stable key."
semantics = """
The identity retrieval the position-first family cannot do: a stable key every \
Kivgraph answer carries, resolved back to the one symbol it names, so a reference \
held across an edit that moved its line still points at the same thing. The key is \
the address; there is no file and no line to pass.\
"""
effects = ["read"]

  [[capability.input]]
  name = "stable_key"
  type = "string"
  required = true
  summary = "The symbol's stable key, as returned by any other answer. Position-independent."

  [[capability.output]]
