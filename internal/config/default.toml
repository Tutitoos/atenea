# Atenea settings.
#
# One file, on purpose: ceilings, rhythms and the catalog live here and
# nowhere else. Atenea is a declarative engine, so changing behavior means
# editing this file, not the core.
#
# This copy is embedded in the binary and runs when no file exists on disk. A
# file of your own replaces the catalog outright but overrides the knobs key by
# key -- a knob you delete falls back to a compiled default instead of
# disappearing, and a list you delete is not the same as a list you empty. See
# docs/content/settings.md.
#
# Conversation with the user is in Spanish; every technical artifact, this file
# included, is in English.

# Version of the core<->adapter contract this file is written against.
contract = "5.0.0"

[core]
# How long a shutdown waits for in-flight work before walking away.
shutdown_grace = "10s"
# How often the service probes declared MCP servers and persists their latest
# reachability. Set to "0s" to keep health strictly on demand via `detect`.
health_probe_every = "15m"

[result_cache]
# Bounded, read-only cache for complete code.context answers. A hit is local
# work and never creates a provider measurement. Set ttl/limits explicitly;
# zero and negative values are rejected.
max_entries = 128
max_bytes = 4194304
ttl = "5m"

[orchestrator]
# The agent that dispatches a capability call and reviews the answer.
#
# How many repositories one workspace.context call asks at once. 0 lifts the
# ceiling. The real brake is the memory of the machine, which arrives with the
# metrics base.
max_parallel = 4

# What ONE CALL may spend, across every step and every paid provider it
# dispatches to. Money is a permission, not a cost: this is the user saying how
# much a piece of work may draw, in the same breath as saying which effects it
# may cause.
#
# The call, not the step. A plan that splits into four steps divides this
# between them and gives back what it did not use; it does not hand each of
# them a fresh one. Same trap as match_limit above, with money instead of
# matches: 0 reads as "no ceiling" and is refused, because a call with
# nothing stopping it is a runaway. A grant that reaches zero WHILE running is
# a different thing and perfectly ordinary -- from there on the paid providers
# refuse and whoever charges nothing keeps working.
budget_usd = 0.90

# Granted, standing, to every call this core dispatches --
# on top of the read that is always free. Shipped ON, not off: code.search's
# only implementations today (ripgrep, and the local stand-in) are both a
# binary, not a library, so refusing process by default would not make
# spawning one auditable, it would make the P0 capability unusable out of
# the box. What this buys is what budget_usd already buys for money: the
# grant is a line in a file the operator can read, edit or remove, not a
# yes wired silently into the binary.
effects = ["process"]

# The same grant, for a chat opened by a connected client rather than by the
# person at this terminal. It ships equal to the line above and separate from
# it on purpose: the two answer different questions, and while they shared one
# line, widening your own floor for an afternoon's work widened every client
# that connected, permanently and silently, with no way to say otherwise here.
#
# Deleting this line does not turn the rule off -- it hands clients whatever
# `effects` says, which is what every settings file written before this key
# existed already does. Writing it, even identically, is what separates them.
# An empty list is a real answer and means a client may only read; it is not
# the default because on this machine every implementation of code.search is
# a binary, so a client would be refused the headline capability on day one
# and the first thing anybody learned about the default would be how to
# remove it.
#
# It is also a ceiling: a client cannot open a chat claiming more than this,
# and may ask at `initialize` to hold less.
client_effects = ["process"]

# Capability-level MCP kill switch. Effects alone cannot block `desktop.move`
# while still allowing read + device observation, so the interactive
# capabilities stay out of tools/list and are refused if called by name.
# Set this to [] only as an explicit phase-two activation.
client_denied_capabilities = ["desktop.open", "desktop.move", "desktop.drag", "desktop.scroll",
                              "desktop.click", "desktop.type", "desktop.key",
                              "android.tap", "android.swipe", "android.type",
                              "android.key", "android.mirror", "android.unmirror"]

# Whether the state of a run in flight is written to disk. Memory is a
# whiteboard; disk is paper. The dump happens when a step closes and again when
# the run closes, and at no other moment.
checkpoints = true
# Empty means $XDG_STATE_HOME/atenea/runs, or ~/.local/state/atenea/runs.
checkpoint_dir = ""

# Who actually executes a step: any of "omp", "claudecode", "codex",
# "tokensave", "desktop", "android" and "local" -- the same seven the loader
# accepts, in the order it lists them when it refuses a name it does not know.
#
# Atenea decides and delegates, so execution always happens on the far side of
# this line, and that far side is an adapter: a dumb translator with no logic
# of its own. It is a list because omp and Claude Code are both first-class
# clients and can be attached at once; each answers for its own
# implementations, and two of them claiming the same one is refused at load.
#
# "omp" is the adapter that ships. "claudecode" drives the Claude Code CLI and
# "codex" drives the native Codex CLI; both are off by default because they
# cost money per call.
# "tokensave" is a graph-backed provider that speaks MCP over stdio only:
# there is no endpoint to fall back on, so it is launched from its own
# [orchestrator.tokensave.process] table and naming it without that table is
# refused at startup rather than discovered as a dead provider mid-run.
# "local" is a stand-in
# that searches the disk directly, for a machine with no client installed. It
# and omp both serve ripgrep, so attaching both is refused at load: the choice
# is exclusive. The stand-in spawns nothing and is far faster for it -- 28-65x
# measured -- but it answers a slightly different question, because it reads no
# .gitignore. Having no client is the reason to choose it; speed is not. An
# empty list leaves the core able to plan and choose, with nothing to dispatch.
runners = ["omp"]

  [orchestrator.omp]
  # The omp executable. A bare name is looked up on PATH, which is the normal
  # case; a full path covers an install somewhere unusual.
  binary = "omp"
  # Implementations the adapter answers for. Anything else it is handed comes
  # back as unavailable, which is the bin that drives fallback.
  implementations = ["ripgrep"]
  # How many matches one search asks omp for.
  #
  # omp always caps. Its own zero is not "no limit": it falls back to a small
  # internal default and then reports the short answer as if it were complete,
  # so Atenea always states the number instead and says out loud when a search
  # reached it.
  match_limit = 10000
  # How long one omp call may take before it is treated as stuck rather than
  # slow. The timeout bin is what lets the core fall back instead of waiting.
  timeout = "30s"

  [orchestrator.claudecode]
  # Claude Code is the headless runner. Claude.app is a GUI client and is
  # consumed through MCP rather than launched as a provider process.
  source = "auto"
  terminal_binary = "claude"
  # Implementations the adapter answers for. This is a different id from
  # ripgrep's on purpose: the same question answered by a model is not the same
  # answer at the same price, and the funnel has to be able to tell them apart.
  implementations = ["claude.search"]
  # This adapter has no ceiling of its own. What a call may spend arrives with
  # the request, from budget_usd under [orchestrator] above -- money is a
  # permission, and permissions are granted per call.
  #
  # How long one call may take. A model turn is slower than a tool call by
  # nature, so this sits above omp's ceiling; past it the turn is stuck rather
  # than thinking, and the timeout bin is what lets the core fall back.
  #
  # Ninety seconds, not the five minutes this used to be. Measured: two real
  # searches against a mid-sized repository made 8 and 9 turns in 55s and 66s
  # -- about seven seconds a turn -- and BOTH were ended by budget_usd, not by
  # time. Five minutes was a leash nothing ever reached, and far longer than
  # anybody waiting at a prompt will sit through. This is ~13 turns of room.
  #
  # It does not overlap with budget_usd: money stops a client working too
  # expensively, this stops one that is not working at all. A client wedged on
  # a lock spends nothing, so no grant will ever end it.
  timeout = "90s"

  [orchestrator.codex]
  # Codex CLI's native non-interactive entry point. Atenea prefers the
  # terminal CLI and falls back to the CLI bundled in ChatGPT.app. This
  # adapter uses Codex's own JSONL event stream and output schema, not Claude
  # Code flags.
  source = "auto"
  terminal_binary = "codex"
  app_binary = "/Applications/ChatGPT.app/Contents/Resources/codex"
  implementations = ["codex.search"]
  timeout = "120s"

  [orchestrator.desktop]
  # This machine's own screen, pointer and accessibility tree, answered through
  # a helper process that owns every macOS API involved. Off unless `runners`
  # names it, and that is not the usual caution about a young feature.
  #
  # What sits behind it is a permission Atenea cannot grant itself. macOS
  # attributes a device grant to the RESPONSIBLE ANCESTOR rather than to the
  # process asking, so an Atenea started from a shell borrows that shell's
  # screen and input access -- measured on macOS 26.6, a signed binary whose
  # own identifier was never authorized reported full access merely for having
  # been launched from a terminal that had it. The adapter refuses the device
  # effect in that case rather than succeeding on somebody else's permission,
  # so this provider is only useful once `atenea service install` has run and
  # the permission has been granted to Atenea itself.
  #
  # The helper is built on this machine and ships in no release:
  #
  #     swift build -c release --package-path helper
  #
  # Not an omission. Distributing a macOS binary that drives the screen needs
  # a Developer ID signature and notarization -- measured on macOS 26.6, an
  # Apple Development signature is rejected by Gatekeeper on another machine
  # exactly as an unsigned one is. Code compiled here carries no quarantine
  # attribute, so Gatekeeper never enters and no certificate is needed by
  # anybody.
  #
  # What a certificate WOULD buy is that the permission survives a rebuild: an
  # ad-hoc signature's designated requirement is pinned to a hash that changes
  # every time, even rebuilding identical source. Signing your own build with
  # your own Apple Development identity (free) is an optional upgrade, not a
  # requirement:
  #
  #     codesign -f -s "Apple Development: ..." \
  #       --identifier com.tutitoos.atenea.desktop --options runtime BINARY
  # Sorted, matching what the compiled fallback answers: a test compares the
  # two and a difference in order would read as a difference in content.
  # Observation is apps, inspect and screenshot; everything else acts.
  implementations = [
    "macos.apps",
    "macos.click",
    "macos.drag",
    "macos.inspect",
    "macos.key",
    "macos.move",
    "macos.open",
    "macos.screenshot",
    "macos.scroll",
    "macos.type",
  ]
  timeout = "10s"             # latency, not payload: a tree walk is one IPC message per node

    # [orchestrator.desktop.process]
    # command = "/absolute/path/to/helper/.build/release/atenea-desktop-helper"
    # instance = "shared"       # there is one desktop; per_repository is refused
    # lifecycle = "on_demand"
    # idle_timeout = "10m"
    # ready_timeout = "10s"

  [orchestrator.android]
  # Typed Android computer use. The adapter constructs fixed ADB/UIAutomator/
  # scrcpy commands and never accepts a caller-supplied command or argument
  # list. It is off unless `runners` names "android".
  implementations = [
    "adb.devices",
    "adb.helper-diagnose",
    "adb.key",
    "adb.screenshot",
    "adb.swipe",
    "adb.tap",
    "adb.type",
    "scrcpy.mirror",
    "scrcpy.unmirror",
    "uiautomator.inspect",
  ]
  adb_binary = "adb"
  scrcpy_binary = "scrcpy"
  helper_mode = "auto"
  timeout = "15s"
  frame_ttl = "30s"

  [orchestrator.tokensave]
  # tokensave is a stdio far side that is not a corpus of repositories but ONE
  # project rooted at a directory: it speaks paths relative
  # to that root, so `root` is required and absolute. Every repository this
  # provider can answer for has to live under it.
  # root = "/absolute/path/to/the/served/project"
  implementations = [
    "tokensave.calls",
    "tokensave.context",
    "tokensave.overview",
  ]
  timeout = "90s"             # re-syncs an index before answering

    # [orchestrator.tokensave.process]
    # Left commented: the command below is one machine's path.
    #
    # command = "tokensave"
    # args = ["serve", "--path", "/absolute/path/to/the/served/project"]
    # instance = "shared"
    # lifecycle = "on_demand"
    # idle_timeout = "10m"

  [orchestrator.local]
  # Implementations the stand-in answers for.
  implementations = ["ripgrep"]
  # Directories never descended into. This is a floor, not an equivalent of the
  # rule a real search tool applies: omp reads the repository's own .gitignore,
  # and this list reads nothing. Measured on a probe repository, the two
  # disagree in both directions -- the stand-in skipped a tracked file under
  # build/ that omp searched, and returned two .gitignore'd files omp did not.
  skip_dirs = [".git", "node_modules", "vendor", "dist", "build", ".venv", "target"]

[selector]
# Runtime health is evidence, not a permanent truth. Once this age passes the
# provider returns to unknown and the next real dispatch can re-probe it.
health_stale_after = "24h"
# Number of valid complete outcomes needed before quality can rank providers.
quality_minimum_samples = 2

[metrics]
# The measurement base: what every attempt cost, on three axes -- time, tokens
# and memory -- filed under the capability asked for and the implementation
# that answered. It is the fuel the funnel will rank on. Until it has real
# figures the funnel ranks on the estimates written further down this file,
# which is guesswork wearing a decimal point.
#
# Turning it off leaves a working core that never learns what anything costs.
enabled = true
# Empty means $XDG_STATE_HOME/atenea/metrics.duckdb, beside the run receipts.
# One embedded file, written by the core and nobody else.
path = ""

# The two rhythms, both served by the one clock so they cannot collide.
#
# Writes are batched: a measurement waits in memory and reaches the disk on the
# beat below. Two moments do not wait for it -- a phase closing and the process
# going down -- so this is the rhythm between them, not the guarantee.
flush = "30s"
# How often the retention ladder is walked: attempts are folded into hours,
# hours into days after a week, days into weeks after a month, weeks into
# months after six. There is always fine detail about the recent past and only
# shapes about the distant one.
compact = "1h"

# How many measurements may wait in memory when writes are failing -- another
# Atenea holding the file, a full disk. Past the ceiling the oldest are dropped
# and counted, because the only thing worse than losing a measurement is not
# knowing that you did. Empty means 10000.
# buffer_limit = 10000

[retention]
# How long the record of what Atenea did is kept: the run receipts on disk.
# The measurement base is NOT covered here -- it
# has a retention ladder of its own, folding attempts into hours and hours into
# days, so it grows in detail rather than in rows.
#
# A receipt is the only record that a call happened, and it carries the
# sentence somebody typed and what the run found. So this is a decision about
# what this machine is allowed to forget, and ninety days is a choice rather
# than the absence of one: long enough to answer "what did I ask last quarter",
# short enough that the five rotating backup copies stop compounding it.
# Measured on the machine this was written on: 182 receipts in five days, at
# about 4 KiB each.
#
# Spelled in hours because a Go duration has no day. "0s" keeps everything
# forever, which is the right answer for a state root managed elsewhere.
keep = "2160h"
# How often the pass runs. Guarded by a mark beside the receipts rather than
# by the beat: most Atenea processes are a command that lives for a second, and
# two starting together must not both decide they are the one to do it.
every = "24h"

# Only closed receipts are removed, and by when they last changed. An open
# receipt may still be in flight, so it is kept past its
# age.

[backup]
# What protects the history. The measurement base, the run receipts and the
# crash notebook are everything Atenea has learned; a disk that loses them
# loses the reason the funnel picks anybody.
#
# Copies are incremental in the only way compatible with dropping the oldest
# one: a file that has not changed is hard-linked to the copy before it, so it
# costs no bytes, and every snapshot stays a complete tree you can restore on
# its own. A chain of deltas would be smaller and would collapse the day the
# rotation removed the base of the chain.
enabled = true
# Empty means a folder of its own BESIDE the state root, never inside it: a
# copy under the tree it copies recurses into itself, and dies with the tree it
# exists to survive. Point this at another disk and it becomes a real backup.
dir = ""
# The rhythm, served by the same clock as the flush and the compaction above so
# the three cannot come due at once and fight over the disk. It is read from
# what is on disk, not from a timer in memory: a service that restarts more
# often than this would otherwise never copy anything at all.
every = "6h"
# How many copies survive. The sixth arrives, the oldest leaves.
keep = 5

[desktop]
# What the desktop capabilities may look at, by bundle identifier.
#
# `applications` EMPTY MEANS DENY ALL, which is the opposite of how an empty
# list usually reads and is the whole point: a capability that can read every
# window on this machine must not be switched on by a settings file that forgot
# to mention it. Find identifiers with desktop.apps, which needs no entry here.
#
# The single entry "*" means every application `denied` does not name. It has
# to be TYPED, and that is the design: the rule above is that omission is not a
# statement, so the widest possible allow-list must not be reachable by leaving
# something blank. Writing it beside named identifiers is refused at load --
# "everything, and also these two" is two sentences that disagree.
#
# `denied` always wins, and is seeded rather than empty. Two lists rather than
# one because a single list would make "never look at my password manager" a
# thing you state by omission -- and omission is what happens when somebody
# adds an entry in a hurry. Deleting this block restores these defaults; an
# explicitly empty list is a statement and is honored. It outranks "*" too,
# which is what keeps the widest allow-list survivable.
applications = []
# What the desktop mutation capabilities may act on. If this field is absent,
# it inherits `applications` for compatibility with older settings. Present as
# `[]` it denies every mutation even when observation remains allowed.
action_applications = []
denied = [
  "com.apple.keychainaccess",
  "com.1password.1password",
  "com.agilebits.onepassword7",
  "com.bitwarden.desktop",
  "com.lastpass.LastPass",
  "org.keepassxc.keepassxc",
  "in.sinew.Enpass-Desktop",
  "com.dashlane.dashlanephonefinal",
]
# Whether one chat may act on the screen it has already read.
#
# False here is the security control, not a cautious guess about one.
# desktop.inspect and desktop.screenshot hand back whatever a window chose to
# display, written by whoever controls that window -- an email, a web page, a
# chat somebody else is in. With this off, a chat handed that content may no
# longer move the pointer or type, so a sentence inside somebody else's message
# cannot reach this machine's input. Acting is still possible: `atenea desktop`
# shows what will happen and waits for a person to agree.
#
# Turning it on is what buys the continuous loop -- look, click, look again --
# and it is the only way to get it. Say plainly what it costs: Atenea runs no
# classifier over what it captured, so with this on there is nothing left
# between a window's text and the pointer. What still stands is `denied` above,
# the hard refusal to type into a secure field, credential redaction in
# desktop.type, and the receipts, which keep the target application and the
# redacted arguments of every device call.
look_then_act = false
# Show the native Atenea border, cursor and live miniature while desktop use
# is active. Presentation only: private PID delivery, frame checks and the
# passive human-input monitor remain mandatory even with visuals disabled.
visual_feedback = true

[android]
# Explicit ADB serials only. Empty denies every emulator and physical device;
# wildcard access is refused so plugging in a new phone never authorizes it.
allowed_serials = []

[security]
# The files that carry secrets inside them. Reading is free by default, and
# this list is the exception. While exploring, a match here is skipped in
# silence: stopping to ask would break the flow, and writing the skip down
# would cost more than ignoring it is worth.
#
# Deleting this block does NOT disarm the guard, it restores these defaults.
# To have no sensitive files at all, write an explicit empty list.
sensitive = [
  ".env",
  ".env.*",
  ".npmrc",
  ".netrc",
  "*.pem",
  "*.key",
  "*.p12",
  "id_rsa",
  "id_ed25519",
  "*credentials*.json",
  "*service-account*.json",
]

# ---------------------------------------------------------------------------
# Capabilities: the stable "what". Agnostic of any tool, by definition.
# ---------------------------------------------------------------------------

[[capability]]
id = "code.context"
version = "1.0.0"
summary = "From a task in prose, find the code it is actually about before acting."
semantics = """
The cold-start move: given a task described in the person's own words, return \
the declarations, related symbols, optional source and (when planning) tests \
that make the task concrete. This is NOT literal text search -- code.search \
answers that -- and not a position-first symbol lookup either: the caller does \
not know a name or a file yet, which is exactly why it asks. Results are \
repository-relative; a provider whose graph spans several repositories must \
drop foreign rows rather than report paths relative to the wrong root, and say \
that it did. mode is intent: explore maps the territory, plan additionally \
names the tests that cover it.\
"""
effects = ["read"]

  [[capability.input]]
  name = "task"
  type = "string"
  required = true
  summary = "Natural-language description of the task or question."

  [[capability.input]]
  name = "mode"
  type = "string"
  required = false
  enum = ["explore", "plan"]
  summary = "Whether to map the code generally or prepare an implementation plan. Defaults to explore."

  [[capability.input]]
  name = "limit"
  type = "int"
  required = false
  summary = "Maximum number of primary symbols. Defaults to 20."

  [[capability.input]]
  name = "keywords"
  type = "string_list"
  required = false
  summary = "Extra domain words when the task's language may not match symbol names."

  [[capability.input]]
  name = "scope"
  type = "string_list"
  required = false
  summary = "Repository-relative paths to include. Empty means the whole repository."

  [[capability.input]]
  name = "include_snippet"
  type = "bool"
  required = false
  summary = "Intent: include source blocks for the most relevant symbols."

  [[capability.input]]
  name = "snippet_lines"
  type = "int"
  required = false
  summary = "Maximum lines per source block when snippets were requested."

  [[capability.input]]
  name = "cursor"
  type = "string"
  required = false
  summary = "Cursor returned by a previous bounded context page."

  [[capability.output]]
  name = "symbols"
  type = "record_list"
  required = true
  summary = "The declarations most relevant to the task, ranked by the provider."

    [[capability.output.field]]
    name = "name"
    type = "string"
    required = true
    summary = "The declaration's name."

    [[capability.output.field]]
    name = "kind"
    type = "string"
    required = true
    summary = "The provider's own kind for the declaration."

    [[capability.output.field]]
    name = "path"
    type = "string"
    required = true
    summary = "File holding the declaration, relative to the repository root."

    [[capability.output.field]]
    name = "line"
    type = "int"
    required = true
    summary = "Line where the declaration starts, starting at 1."

    [[capability.output.field]]
    name = "signature"
    type = "string"
    required = false
    summary = "The declaration's signature, when the provider reports it."

    [[capability.output.field]]
    name = "summary"
    type = "string"
    required = false
    summary = "The declaration's own documentation, when the provider reports it."

  [[capability.output]]
  name = "related"
  type = "record_list"
  required = false
  summary = "Other declarations connected to the primary symbols."

    [[capability.output.field]]
    name = "name"
    type = "string"
    required = true

    [[capability.output.field]]
    name = "path"
    type = "string"
    required = true

    [[capability.output.field]]
    name = "line"
    type = "int"
    required = true

  [[capability.output]]
  name = "snippets"
  type = "record_list"
  required = false
  summary = "Source blocks for primary symbols, only when asked for and never from sensitive files."

    [[capability.output.field]]
    name = "name"
    type = "string"
    required = true

    [[capability.output.field]]
    name = "path"
    type = "string"
    required = true

    [[capability.output.field]]
    name = "line"
    type = "int"
    required = true

    [[capability.output.field]]
    name = "code"
    type = "string"
    required = true

  [[capability.output]]
  name = "truncated"
  type = "bool"
  required = false
  summary = "Whether more intent results are available through next_cursor."

  [[capability.output]]
  name = "next_cursor"
  type = "string"
  required = false
  summary = "Opaque cursor for the next bounded intent page."

  [[capability.output]]
  name = "source_trimmed"
  type = "int"
  required = false
  summary = "Number of source bodies omitted by the provider byte ceiling."

  [[capability.output]]
  name = "tests"
  type = "string_list"
  required = false
  summary = "Tests that cover the relevant code, reported in plan mode."

[[capability]]
id = "code.search"
version = "1.0.0"
summary = "Find literal text in a repository without understanding the code."
semantics = """
Flat text search. The engine behind it does not need to parse anything: this is \
the ripgrep-shaped capability, not the symbol-shaped one. Options are stated as \
INTENT, never as a technical order, so the capability is not married to any one \
engine. Snippets carry two lines of context above and below unless the caller \
asks for more.\
"""
effects = ["read", "process"]

  [[capability.input]]
  name = "query"
  type = "string"
  required = true
  summary = "The text to look for."

  [[capability.input]]
  name = "scope"
  type = "string_list"
  required = false
  summary = "Paths to search: the repository, a folder or a single file. Empty means the whole repository."

  [[capability.input]]
  name = "match_case"
