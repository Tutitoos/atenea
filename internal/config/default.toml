[[capability]]
id = "symbol.overview"
version = "1.0.0"
summary = "What a file declares, without knowing any of it by name first."
semantics = """
The entry move into an unfamiliar file: every symbol it declares, before \
anything in it can be asked about by name or position. Every other symbol.* \
capability needs one of those handed to it; this is the one that hands it \
back. Depth controls how far to descend into nested symbols -- a struct's \
fields, for languages that have them -- with 0, the default, listing only \
what the file declares at its own top level. Line and column both come back, \
and both are real positions, not a hint: line is what the provider reports, \
column is recovered by finding the symbol's own name as a whole word on that \
line, because no provider behind this capability ever reports one itself.\
"""
effects = ["read"]

  [[capability.input]]
  name = "file"
  type = "string"
  required = true
  summary = "File to list, relative to the repository root."

  [[capability.input]]
  name = "depth"
  type = "int"
  required = false
  summary = "How many levels of nesting to descend into (a struct's fields, for example). 0 by default."

  [[capability.output]]
  name = "symbols"
  type = "record_list"
  required = true
  summary = "Every symbol the file declares, in the order the provider found them."

    [[capability.output.field]]
    name = "name"
    type = "string"
    required = true
    summary = "The symbol's own name."

    [[capability.output.field]]
    name = "kind"
    type = "string"
    required = true
    summary = """
What kind of symbol this is, in the provider's own vocabulary (function, struct, \
method, ...). It is the one field here that is not comparable between providers: \
two of them can be equally right about the same symbol and still call it \
different things, because the distinction one draws may not exist in what the \
other reads. Branch on name, line and column; read kind.\
"""

    [[capability.output.field]]
    name = "line"
    type = "int"
    required = true
    summary = "Line where the symbol starts, starting at 1."

    [[capability.output.field]]
    name = "column"
    type = "int"
    required = true
    summary = "Column where the symbol's name starts on that line, starting at 1."

    [[capability.output.field]]
    name = "end_line"
    type = "int"
    required = false
    summary = "Line where the symbol's body ends, starting at 1. Absent for a symbol that fits on one line, where it would only repeat line."

    [[capability.output.field]]
    name = "parent"
    type = "string"
    required = false
    summary = "Name of the enclosing symbol, when this one is nested (depth > 0)."

[[capability]]
id = "symbol.calls"
version = "1.0.0"
summary = "From a symbol, walk the call graph in a chosen direction."
semantics = """
Where a symbol sits on the CALL graph, not everywhere it is mentioned -- that is \
symbol.references's question, and a call is one narrow kind of mention among the \
many it does not separate out. Position and the name hint are inherited from the \
same family. Direction is not guessed: incoming and outgoing are different \
questions with different answers, so the caller states which one, or both. Depth \
bounds how far the walk goes, small by default, because a workspace of many \
repositories turns an unbounded walk into hundreds of hits before anyone asked \
for that many. Unlike a reference, a call names a DIFFERENT symbol -- the one \
calling in, or the one being called out to -- so every result carries its own \
name and its own distance from the symbol asked about, not only where it sits.\
"""
effects = ["read"]

  [[capability.input]]
  name = "file"
  type = "string"
  required = true
  summary = "File holding the symbol, relative to the repository root."

  [[capability.input]]
  name = "line"
  type = "int"
  required = true
  summary = "Line where the symbol appears, starting at 1."

  [[capability.input]]
  name = "column"
  type = "int"
  required = true
  summary = "Column where the symbol starts on that line, starting at 1."

  [[capability.input]]
  name = "name"
  type = "string"
  required = false
  summary = "Hint: the symbol's name, for tie-breaking and for reading the request."

  [[capability.input]]
  name = "direction"
  type = "string"
  required = true
  summary = "Which way to walk: \"incoming\" (who calls this), \"outgoing\" (what this calls), or \"both\"."
  enum = ["incoming", "outgoing", "both"]

  [[capability.input]]
  name = "scope"
  type = "string_list"
  required = false
  summary = "Paths to look in. Empty means the whole repository."

  [[capability.input]]
  name = "depth"
  type = "int"
  required = false
  summary = "How many hops to follow. Small by default, on purpose."

  [[capability.input]]
  name = "include_snippet"
  type = "bool"
  required = false
  summary = "Intent: return the line at each call, not only where it is."

  [[capability.input]]
  name = "snippet_lines"
  type = "int"
  required = false
  summary = "How much to return around each call. Small by default, on purpose."

  [[capability.output]]
  name = "calls"
  type = "record_list"
  required = true
  summary = "Every call found, nearest hop first."

    [[capability.output.field]]
    name = "path"
    type = "string"
    required = true
    summary = "File holding the call, relative to the repository root."

    [[capability.output.field]]
    name = "line"
    type = "int"
    required = true
    summary = "Line of the call, starting at 1."

    [[capability.output.field]]
    name = "name"
    type = "string"
    required = true
    summary = "The name of the symbol found at this hop."

    [[capability.output.field]]
    name = "direction"
    type = "string"
    required = true
    summary = "Whether this result was found walking \"incoming\" or \"outgoing\" from the symbol asked about."
    # "both" is missing on purpose: it is a question, not an answer. A hop was
    # found walking one way or the other, never both at once.
    enum = ["incoming", "outgoing"]

    [[capability.output.field]]
    name = "depth"
    type = "int"
    required = true
    summary = "How many hops from the symbol asked about, starting at 1."

    [[capability.output.field]]
    name = "snippet"
    type = "string"
    required = false
    summary = "The line at the call, present only when it was asked for."

