  type = "string"
  required = true
  summary = "Explicitly allowed ADB serial."

  [[capability.output]]
  name = "serial"
  type = "string"
  required = true
  summary = "Diagnosed ADB serial."

  [[capability.output]]
  name = "backend_selection"
  type = "record"
  required = true
  summary = "Configured mode, selected backend and negotiated helper contract."

    [[capability.output.field]]
    name = "mode"
    type = "string"
    required = true
    enum = ["auto", "adb", "helper"]
    summary = "Configured helper selection mode."

    [[capability.output.field]]
    name = "selected"
    type = "string"
    required = true
    enum = ["adb", "helper"]
    summary = "Backend selected by negotiation."

    [[capability.output.field]]
    name = "capabilities"
    type = "string_list"
    required = true
    summary = "Capabilities reported for the selected backend."

    [[capability.output.field]]
    name = "helper_package"
    type = "string"
    required = true
    summary = "Fixed Android helper package."

    [[capability.output.field]]
    name = "helper_status"
    type = "string"
    required = true
    enum = ["not_probed", "not_installed", "unavailable", "incompatible", "compatible"]
    summary = "Outcome of the helper probe."

    [[capability.output.field]]
    name = "helper_version"
    type = "string"
    required = false
    summary = "Compatible helper version."

    [[capability.output.field]]
    name = "helper_protocol"
    type = "int"
    required = false
    summary = "Compatible helper protocol version."

    [[capability.output.field]]
    name = "helper_reason"
    type = "string"
    required = false
    summary = "Bounded explanation when the helper was not selected."

  [[capability.output]]
  name = "task_result"
  type = "string"
  required = true
  enum = ["not_run"]
