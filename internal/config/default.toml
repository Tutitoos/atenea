  name = "scope"
  type = "string_list"
  required = false
  summary = "Paths to look in. Empty means the whole repository."

  [[capability.input]]
  name = "depth"
  type = "int"
  required = false
  summary = "How many hops to follow. Small by default, on purpose."

  [[capability.input]]
  name = "include_snippet"
  type = "bool"
  required = false
  summary = "Intent: return the line at each call, not only where it is."

  [[capability.input]]
  name = "snippet_lines"
  type = "int"
  required = false
  summary = "How much to return around each call. Small by default, on purpose."

  [[capability.output]]
  name = "calls"
  type = "record_list"
  required = true
  summary = "Every call found, nearest hop first."

    [[capability.output.field]]
