  required = true
  summary = "Display with the greatest intersection area with the captured window."

  [[capability.output]]
  name = "intersecting_display_ids"
  type = "string_list"
  required = true
  summary = "Every display intersected by the captured window."

  [[capability.output]]
  name = "intersecting_displays"
  type = "record_list"
  required = true
  summary = "Identity, global frame and scale of every display intersected by the window."

    [[capability.output.field]]
    name = "id"
