  type = "bool"
  required = false
  summary = "Intent: match whole words only."

  [[capability.input]]
  name = "file_types"
  type = "string_list"
  required = false
  summary = "Intent: restrict the search to these file types."

  [[capability.input]]
  name = "context_lines"
  type = "int"
  required = false
  summary = "Lines of context around each match. Defaults to 2 above and 2 below."

  [[capability.output]]
  name = "matches"
