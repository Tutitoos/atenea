# ---------------------------------------------------------------------------
# The web: one capability, three prices.
# ---------------------------------------------------------------------------

[[capability]]
id = "web.fetch"
version = "1.0.0"
summary = "Fetch one web page and return its content."
semantics = """
One page, one answer. `url` must be http or https, and where it may point is decided by \
[web] against the RESOLVED address rather than the hostname -- a name is somebody else's \
claim about where it points. `selector` narrows to matching elements before the answer \
leaves the server, which is where narrowing is cheapest; without it the whole page comes \
back and the only ceiling is the transport's, not this capability's. `format` picks a \
rendering and falls back rather than failing when the far side did not produce it: the \
page was retrieved either way, and an error about the missing rendering would be less \
useful than the one that exists. \
An anti-bot interstitial is NOT an answer. It arrives as a successful 200 carrying a page \
about how much the site cares about security, and the implementations below report it as \
unavailable so the funnel escalates to a heavier one -- see the note on cost.\
"""
effects = ["read", "external"]

# What a call here is about, beyond the repository -- which these two capabilities
# ignore entirely. Every page on one site is one subject, because whether a site
# refuses a provider is a fact about the site and not about the path.
#
# It scopes HEALTH and not cost. One page behind Cloudflare must not mark the
# cheap implementation unhealthy for every other site, which is what happened
# before this existed. What a fetch costs is a fact about the far side and its
# browser, so merging subjects there gives a larger sample of the same thing.
subject_from = "url"
subject_kind = "url_host"

  [[capability.input]]
  name = "url"
  type = "string"
  required = true
  summary = "The page to fetch. http or https; anything else is refused by scheme."

  [[capability.input]]
  name = "selector"
  type = "string"
  required = false
  summary = "CSS selector to narrow to before answering. Omitted returns the whole page."

  [[capability.input]]
  name = "format"
  type = "string"
  required = false
  enum = ["text", "markdown", "html"]
  summary = "How to render the body. Defaults to text."

  [[capability.output]]
  name = "page"
  type = "record_list"
  required = true
  summary = "The page that was fetched. Exactly one row."

    [[capability.output.field]]
    name = "url"
    type = "string"
    required = true
    summary = "The url that was asked for."

    [[capability.output.field]]
    name = "final_url"
    type = "string"
    required = false
    summary = "Where the far side reports having landed, when it says. Re-checked against [web]."

    [[capability.output.field]]
    name = "status"
    type = "int"
    required = false
    summary = "The HTTP status, when the far side reports one."

    [[capability.output.field]]
    name = "title"
    type = "string"
    required = false
    summary = "The page title, when there is one."

    [[capability.output.field]]
    name = "content"
    type = "string"
    required = true
    summary = "The body, in the requested rendering or the nearest one that exists."

    [[capability.output.field]]
    name = "truncated"
    type = "bool"
    required = false
    summary = "Whether the body was cut. The ceiling is the transport's, not this capability's."

# Three implementations, one capability, and the funnel picks on measured cost.
#
# The durations are MEASURED, against scrapling-mcp 0.3.9 on 2026-08-26,
# fetching https://example.com/ through Atenea: request 2.49s over five calls,
# fetch 8.44s, stealth 12.72s over four. They are an order of magnitude above
# the first draft of this table, which guessed 250ms for a plain HTTP request
# and was wrong about what dominates -- the cost here is the Python far side
# and its browser, not the network.
#
# They still only decide the ranking until the base has samples of its own,
# which is the point: the first version of this table sent the funnel to the
# cheapest-declared level, the measurement came back at 3.95s, and the next
# call moved to `fetch` on its own. Declared numbers are a starting guess that
# the base is expected to overrule.
#
# The tokens are estimates and stay estimates: they are what a page costs a
# model to read, they are the same at every level because the page is the same
# page, and example.com is not a page worth generalizing a size from. Ranking
# these three apart is a question about time, not about payload.

[[implementation]]
id = "scrapling.request"
provider = "scrapling"
capability = "web.fetch"
scope_guarantee = "confined"   # it never looks at the repository at all

  [implementation.constraints]
  languages = []
  requires_index = false
  min_scale = ""
  max_scale = ""

  [implementation.cost]
  # One HTTP request with browser impersonation. No browser is started, which
  # is the whole reason this level exists and the reason it ranks first. The
  # seconds are the far side, not the fetch.
  estimated_duration = "2.5s"
  estimated_tokens = 800

[[implementation]]
id = "scrapling.fetch"
provider = "scrapling"
capability = "web.fetch"
scope_guarantee = "confined"   # it never looks at the repository at all

  [implementation.constraints]
  languages = []
  requires_index = false
  min_scale = ""
  max_scale = ""

  [implementation.cost]
  # A real browser renders the page. This is what a site that builds its
  # content in JavaScript costs, and it is roughly three times the one above.
  estimated_duration = "8.5s"
  estimated_tokens = 1200

[[implementation]]
id = "scrapling.stealth"
provider = "scrapling"
capability = "web.fetch"
scope_guarantee = "confined"   # it never looks at the repository at all

  [implementation.constraints]
  languages = []
  requires_index = false
  min_scale = ""
  max_scale = ""

  [implementation.cost]
  # Fingerprint spoofing and waiting a challenge out -- solve_cloudflare is
  # this level's real weapon. The last level there is, so a block here is
  # reported as the answer rather than as unavailable: escalating would be
  # asking the funnel to fall back to nobody and lose the reason on the way.
  estimated_duration = "13s"
  estimated_tokens = 1200

# ---------------------------------------------------------------------------
# Pulling named fields out of a page.
# ---------------------------------------------------------------------------

[[capability]]
id = "web.extract"
version = "1.0.0"
summary = "Pull named fields out of one web page."
semantics = """
Named selectors in, one row per match out. `fields` is a list of {name, selector}; the \
answer is a list of {field, index, value}, one row for every element a selector matched, \
in document order. A field that matched nothing contributes no rows. \
The answer is LONG rather than wide -- rows keyed by field name, not one record with a \
column per field -- because output fields are declared statically in this catalog, and a \
shape that depends on the selectors a caller happens to pass cannot be named in advance. \
The caller pivots. A wide shape would have to be declared as an untyped bag, which is a \
promise that says nothing. \
Two costs to know before using it, both consequences of the far side taking ONE selector \
per call. The origin sees ONE REQUEST PER FIELD for a single page. And the fields are \
read seconds apart, so a page that changes underneath yields a record that was never true \
all at once -- for anything moving, fetch once with web.fetch and read the whole thing. \
There is no per-field attribute input. The far side renders text, html or markdown and \
does not extract attributes, so declaring one would promise what nothing here can honor; \
format = "html" returns the matched elements whole, hrefs included, for a caller that \
needs them.\
"""
effects = ["read", "external"]

# What a call here is about, beyond the repository -- which these two capabilities
# ignore entirely. Every page on one site is one subject, because whether a site
# refuses a provider is a fact about the site and not about the path.
#
# It scopes HEALTH and not cost. One page behind Cloudflare must not mark the
# cheap implementation unhealthy for every other site, which is what happened
# before this existed. What a fetch costs is a fact about the far side and its
# browser, so merging subjects there gives a larger sample of the same thing.
subject_from = "url"
subject_kind = "url_host"

  [[capability.input]]
  name = "url"
  type = "string"
  required = true
  summary = "The page to read. http or https; anything else is refused by scheme."

  [[capability.input]]
  name = "fields"
  type = "record_list"
  required = true
  summary = "The named selectors to read. Names must be unique: the rows are keyed by them."

    [[capability.input.field]]
    name = "name"
    type = "string"
    required = true
    summary = "What to call this field in the answer."

    [[capability.input.field]]
    name = "selector"
    type = "string"
    required = true
    summary = "The CSS selector that finds it. Every match becomes a row."

  [[capability.input]]
  name = "format"
  type = "string"
  required = false
  enum = ["text", "markdown", "html"]
  summary = "How to render each match. Defaults to text. Applies to every field."

  [[capability.output]]
  name = "rows"
  type = "record_list"
  required = true
  summary = "One row per match, grouped by field and ordered as the page had them."

    [[capability.output.field]]
    name = "field"
    type = "string"
    required = true
    summary = "The name the caller gave this selector."

    [[capability.output.field]]
    name = "index"
    type = "int"
    required = true
    summary = "Which match this is within that field, from zero, in document order."

    [[capability.output.field]]
    name = "value"
    type = "string"
    required = true
    summary = "The matched element, in the requested rendering."

# The same three prices as web.fetch, paid for a different promise -- and paid
# once PER FIELD, which is what the durations below already account for. They
# are the fetch numbers multiplied by three, on the reading that a caller asking
# for named fields is typically asking for a handful rather than one. A guess
# about shape rather than about speed, and the base overrules it as soon as real
# calls land.

[[implementation]]
id = "scrapling.extract_request"
provider = "scrapling"
capability = "web.extract"
scope_guarantee = "confined"   # it never looks at the repository at all

  [implementation.constraints]
  languages = []
  requires_index = false
  min_scale = ""
  max_scale = ""

  [implementation.cost]
  # Measured warm at ~0.75s per selector against news.ycombinator.com; the
  # first call of a cold server pays for the far side starting.
  estimated_duration = "7.5s"
  estimated_tokens = 900

[[implementation]]
id = "scrapling.extract_fetch"
provider = "scrapling"
capability = "web.extract"
scope_guarantee = "confined"   # it never looks at the repository at all

  [implementation.constraints]
  languages = []
  requires_index = false
  min_scale = ""
  max_scale = ""

  [implementation.cost]
  # A browser render per field, which is the level where the per-field cost
  # stops being an implementation detail and starts being the reason to reach
  # for web.fetch instead.
  estimated_duration = "25s"
  estimated_tokens = 1300

[[implementation]]
id = "scrapling.extract_stealth"
provider = "scrapling"
capability = "web.extract"
scope_guarantee = "confined"   # it never looks at the repository at all

  [implementation.constraints]
  languages = []
  requires_index = false
  min_scale = ""
  max_scale = ""

  [implementation.cost]
  # The last level, so a block here is the answer rather than an escalation.
  estimated_duration = "40s"
  estimated_tokens = 1300

# ---------------------------------------------------------------------------
# Walking one site.
# ---------------------------------------------------------------------------

[[capability]]
id = "web.crawl"
version = "1.0.0"
summary = "Walk one site from a starting page and return what it found."
semantics = """
One site, many pages. `start_url` is the seed; every page reached is on the SAME HOST as \
that seed, and that is a property of the capability rather than an option. The destination \
gate resolves a host and judges the address before anything is fetched, and a crawl's \
frontier is discovered as it goes -- so the frontier is confined to the host the gate \
already approved, because the alternative is a second copy of that gate in the helper, and \
a security control with two implementations has two behaviors. \
robots.txt is obeyed and is not an argument. A caller who could turn it off per call would \
make "does Atenea respect robots.txt" a question with no answer; if it should ever be \
possible, that belongs in [web] where somebody writes it down once. \
Bounded twice: `max_depth` is what the caller asked for and `max_pages` is the ceiling that \
makes a mistake in the first one survivable, because a depth of three on a site with a \
calendar is not a small number. Why the walk ENDED comes back as a discovery, because a \
budget that ran out and a site with no more links produce the same rows and only one of \
them means there is more here. \
This is the expensive way to read a site. For one page, web.fetch costs one request.\
"""
effects = ["read", "external"]
subject_from = "start_url"
subject_kind = "url_host"

  [[capability.input]]
  name = "start_url"
  type = "string"
  required = true
  summary = "Where to start. http or https; every page reached is on this host."

  [[capability.input]]
  name = "max_pages"
  type = "int"
  required = false
  summary = "How many pages at most. Defaults to 25 and the helper caps it at 500."

  [[capability.input]]
  name = "max_depth"
  type = "int"
  required = false
  summary = "How many links deep from the seed. Defaults to 2; zero fetches only the seed."

  [[capability.input]]
  name = "selector"
  type = "string"
  required = false
  summary = "CSS selector to narrow each page to. Omitted returns the whole page."

  [[capability.input]]
  name = "format"
  type = "string"
  required = false
  enum = ["text", "markdown", "html"]
  summary = "How to render each page. Defaults to text."

  [[capability.output]]
  name = "pages"
  type = "record_list"
  required = true
  summary = "The pages the walk reached, the seed first."

    [[capability.output.field]]
    name = "url"
    type = "string"
    required = true
    summary = "The page's own url."

    [[capability.output.field]]
    name = "depth"
    type = "int"
    required = true
    summary = "How many links from the seed, which is zero."

    [[capability.output.field]]
    name = "status"
    type = "int"
    required = false
    summary = "The HTTP status, when the far side reports one."

    [[capability.output.field]]
    name = "title"
    type = "string"
    required = false
    summary = "The page title, when there is one."

    [[capability.output.field]]
    name = "content"
    type = "string"
    required = true
    summary = "The page, in the requested rendering."

# Two implementations rather than three. A crawl is already many requests, and
# a middle tier between plain and stealth would multiply the cost that is the
# whole reason to reach for web.fetch instead when one page will do.
#
# Neither escalates. With two levels the cheap one moving up IS the ladder, and
# a crawl that spent its page budget being challenged has spent it -- reporting
# that as unavailable would buy a retry of the whole walk at the expensive
# level, against a site that has already said no once per page.
#
# The durations are per CRAWL, not per page: max_pages defaults to 25 and the
# helper throttles itself, so these are the estimates for a default-sized walk
# and the base overrules them as soon as real ones land.

[[implementation]]
id = "scrapling.crawl"
provider = "scrapling"
capability = "web.crawl"
scope_guarantee = "confined"   # it never looks at the repository at all

  [implementation.constraints]
  languages = []
  requires_index = false
  min_scale = ""
  max_scale = ""

  [implementation.cost]
  # Twenty-five pages at roughly the plain-request cost, plus the delay the
  # helper keeps between them on purpose.
  estimated_duration = "45s"
  estimated_tokens = 12000

[[implementation]]
id = "scrapling.crawl_stealth"
provider = "scrapling"
capability = "web.crawl"
scope_guarantee = "confined"   # it never looks at the repository at all

  [implementation.constraints]
  languages = []
  requires_index = false
  min_scale = ""
  max_scale = ""

  [implementation.cost]
  # A browser per page. This is the number that should make a caller ask
  # whether they wanted a crawl at all.
  estimated_duration = "5m"
  estimated_tokens = 14000
