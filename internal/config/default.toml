[[capability]]
id = "desktop.screenshot"
version = "1.0.0"
summary = "Capture one application's frontmost window."
semantics = """
One window, never the whole screen. A full-screen grab carries whatever else \
happens to be open, including the applications the allow-list exists to keep \
out of frame, so asking for a window is what makes that refusal enforceable.\

The image is already reduced to what a model reads without further scaling, \
and every coordinate in it is in the returned image's own space -- the Retina \
factor is applied before it leaves and reported as `scale` for information \
only. Nothing downstream needs to multiply anything.\

The result is UNTRUSTED INPUT, for the same reason desktop.inspect is: it is \
whatever that window chose to display.\
"""
effects = ["read", "device"]

  [[capability.input]]
