# Atenea settings.
#
# One file, on purpose: ceilings, rhythms and the catalog live here and
# nowhere else. Atenea is a declarative engine, so changing behavior means
# editing this file, not the core.
#
# This copy is embedded in the binary and runs when no file exists on disk. A
# file of your own replaces the catalog outright but overrides the knobs key by
# key -- a knob you delete falls back to a compiled default instead of
# disappearing, and a list you delete is not the same as a list you empty. See
# docs/content/settings.md.
#
# Conversation with the user is in Spanish; every technical artifact, this file
# included, is in English.

# Version of the core<->adapter contract this file is written against.
contract = "3.0.0"

[core]
# How long a shutdown waits for in-flight work before walking away.
shutdown_grace = "10s"

[orchestrator]
# The agent that receives a commission, explores the repositories in scope,
# splits the work into a graph of steps and hands them out.
#
# How many steps of one wave run at a time. 0 lifts the ceiling. The real brake
# is the memory of the machine, which arrives with the metrics base.
max_parallel = 4

# What ONE COMMISSION may spend, across every step and every paid provider it
# dispatches to. Money is a permission, not a cost: this is the user saying how
# much a piece of work may draw, in the same breath as saying which effects it
# may cause.
#
# The commission, not the call. A run that splits into four steps divides this
# between them and gives back what it did not use; it does not hand each of
# them a fresh one. Same trap as match_limit above, with money instead of
# matches: 0 reads as "no ceiling" and is refused, because a commission with
# nothing stopping it is a runaway. A grant that reaches zero WHILE running is
# a different thing and perfectly ordinary -- from there on the paid providers
# refuse and whoever charges nothing keeps working.
budget_usd = 0.25

# Granted, standing, to every commission and question this core dispatches --
# on top of the read that is always free. Shipped ON, not off: code.search's
# only implementations today (ripgrep, and the local stand-in) are both a
# binary, not a library, so refusing process by default would not make
# spawning one auditable, it would make the P0 capability unusable out of
# the box. What this buys is what budget_usd already buys for money: the
# grant is a line in a file the operator can read, edit or remove, not a
# yes wired silently into the binary.
effects = ["process"]

# The same grant, for a chat opened by a connected client rather than by the
# person at this terminal. It ships equal to the line above and separate from
# it on purpose: the two answer different questions, and while they shared one
# line, widening your own floor for an afternoon's work widened every client
# that connected, permanently and silently, with no way to say otherwise here.
#
# Deleting this line does not turn the rule off -- it hands clients whatever
# `effects` says, which is what every settings file written before this key
# existed already does. Writing it, even identically, is what separates them.
# An empty list is a real answer and means a client may only read; it is not
# the default because on this machine every implementation of code.search is
# a binary, so a client would be refused the headline capability on day one
# and the first thing anybody learned about the default would be how to
# remove it.
#
# It is also a ceiling: a client cannot open a chat claiming more than this,
# and may ask at `initialize` to hold less.
client_effects = ["process"]

# Whether the state of a run in flight is written to disk. Memory is a
# whiteboard; disk is paper. The dump happens when a step closes and again when
# the run closes, and at no other moment.
checkpoints = true
# Empty means $XDG_STATE_HOME/atenea/runs, or ~/.local/state/atenea/runs.
checkpoint_dir = ""

# Who actually executes a step: any of "omp", "claudecode", "serena" and
# "local".
#
# Atenea decides and delegates, so execution always happens on the far side of
# this line, and that far side is an adapter: a dumb translator with no logic
# of its own. It is a list because omp and Claude Code are both first-class
# clients and can be attached at once; each answers for its own
# implementations, and two of them claiming the same one is refused at load.
#
# "omp" is the adapter that ships. "claudecode" drives the Claude Code CLI and
# is off by default because it costs money per call. "serena" is not a CLI at
# all: it is an MCP server, attached the same way because a capability does not
# care whether its provider is a command or a server. "local" is a stand-in
# that searches the disk directly, for a machine with no client installed. It
# and omp both serve ripgrep, so attaching both is refused at load: the choice
# is exclusive. The stand-in spawns nothing and is far faster for it -- 28-65x
# measured -- but it answers a slightly different question, because it reads no
# .gitignore. Having no client is the reason to choose it; speed is not. An
# empty list leaves the core able to plan and choose, with nothing to dispatch.
runners = ["omp"]

  [orchestrator.omp]
  # The omp executable. A bare name is looked up on PATH, which is the normal
  # case; a full path covers an install somewhere unusual.
  binary = "omp"
  # Implementations the adapter answers for. Anything else it is handed comes
  # back as unavailable, which is the bin that drives fallback.
  implementations = ["ripgrep"]
  # How many matches one search asks omp for.
  #
  # omp always caps. Its own zero is not "no limit": it falls back to a small
  # internal default and then reports the short answer as if it were complete,
  # so Atenea always states the number instead and says out loud when a search
  # reached it.
  match_limit = 10000
  # How long one omp call may take before it is treated as stuck rather than
  # slow. The timeout bin is what lets the core fall back instead of waiting.
  timeout = "30s"

  [orchestrator.claudecode]
  # The claude executable. A bare name is looked up on PATH.
  binary = "claude"
  # Implementations the adapter answers for. This is a different id from
  # ripgrep's on purpose: the same question answered by a model is not the same
  # answer at the same price, and the funnel has to be able to tell them apart.
  implementations = ["claude.search"]
  # This adapter has no ceiling of its own. What a call may spend arrives with
  # the commission, from budget_usd under [orchestrator] above -- money is a
  # permission, and permissions are granted per commission.
  #
  # How long one call may take. A model turn is slower than a tool call by
  # nature, so this sits above omp's ceiling; past it the turn is stuck rather
  # than thinking, and the timeout bin is what lets the core fall back.
  #
  # Ninety seconds, not the five minutes this used to be. Measured: two real
  # searches against a mid-sized repository made 8 and 9 turns in 55s and 66s
  # -- about seven seconds a turn -- and BOTH were ended by budget_usd, not by
  # time. Five minutes was a leash nothing ever reached, and far longer than
  # anybody waiting at a prompt will sit through. This is ~13 turns of room.
  #
  # It does not overlap with budget_usd: money stops a client working too
  # expensively, this stops one that is not working at all. A client wedged on
  # a lock spends nothing, so no grant will ever end it.
  timeout = "90s"

  [orchestrator.serena]
  # Where Serena is listening. It runs as an MCP server behind a local proxy
  # rather than as a command, so this is a URL and not a binary. The port is
  # whatever the proxy was told to bind; leaving it unpinned is how you end up
  # with a URL that works until the next restart.
  #
  # The host is a literal address and NOT `localhost`, deliberately. The proxy
  # binds 127.0.0.1 -- IPv4, and only IPv4 -- while `localhost` is a name whose
  # answer belongs to the machine, not to Atenea. The day it resolves ::1 first,
  # which is the default nearly everywhere and arrives on its own with a
  # resolver update, a name here would start refusing connections with nothing
  # on this side having changed. An address cannot be reinterpreted.
  # See docs/content/diagnosing-providers.md.
  endpoint = "http://127.0.0.1:40010/mcp"
  # Implementations the adapter answers for. serena.search is deliberately NOT
  # here: this adapter is wired for the symbol capabilities, and claiming a
  # text search it has no code for would make the funnel promise an answer
  # nobody can give.
  implementations = ["serena.definition", "serena.references", "serena.implementations", "serena.overview"]
  # How long one call may take. A language server that has to index a cold
  # repository is slow long before it is stuck, so this sits above omp's
  # ceiling and well below a model turn's.
  timeout = "90s"

  # [orchestrator.serena.process]
  # Uncomment to have Atenea launch and supervise Serena itself as a bare
  # process instead of assuming it is already running at endpoint above --
  # no ToolHive, no container, no proxy started by hand. Atenea starts it,
  # watches it over the same MCP wire it serves on, and restarts it a
  # bounded number of times if it crashes, exactly like the break-in
  # rotation this design already applies to providers.
  #
  # command = "serena"
  # args = ["start-mcp-server", "--transport", "streamable-http", "--port", "{{port}}"]
  # {{port}} is replaced with the chosen port before every spawn.
  #
  # "persistent" warms it up with Atenea and keeps it running throughout;
  # "on_demand" starts it on first use and stops it once nothing has asked
  # for it in a while. There is no default -- pick the one that matches how
  # steadily this machine actually uses Serena.
  # lifecycle = "on_demand"
  #
  # Port 0 (the default, and generally the right choice) asks the OS for a
  # free one; a fixed number is only worth pinning if something else on this
  # machine needs to find Serena at a stable address.
  # port = 0
  #
  # The rest tune crash recovery and all take the supervisor package's own
  # defaults when left out: restart_limit, restart_delay, stable_after,
  # ready_timeout, stop_grace.
  #
  # idle_timeout is the exception: it is how long an idle server may sit
  # before it is stopped, so it belongs to "on_demand" alone. Writing it
  # beside "persistent" is refused rather than ignored -- nothing about a
  # persistent server would ever have shown you it was doing nothing.
  #
  # instance says how many copies of this server there should be. "shared"
  # (the default) is one for the whole machine, retargeted with
  # activate_project whenever a call arrives for a different repository.
  # "per_repository" is one process per [[repository]] below, each started
  # with its own project and never retargeted -- worth its memory exactly
  # when work alternates between repositories often enough that the
  # retargeting is what you are waiting for.
  #
  # per_repository requires {{project}} somewhere in args, which is replaced
  # with the repository's path, and forbids a fixed port: each copy needs its
  # own, so leave port unset and let Atenea pick them.
  # instance = "shared"

  [orchestrator.codebasememory]
  # The codebase-memory-mcp executable. A bare name is looked up on PATH.
  binary = "codebase-memory-mcp"
  # Implementations the adapter answers for. This adapter is wired for the two
  # capabilities that read the call graph itself -- symbol.calls and
  # code.impact -- for symbol.overview, which reads the same graph at rest
  # rather than walking it, and for the one that writes what they all read:
  # repository.index. It has no code path for code.search, and naming one here
  # is now refused at load rather than discovered at the call: core checks this
  # list against what the adapter can actually dispatch.
  implementations = ["codebase-memory.calls", "codebase-memory.overview", "codebase-memory.impact", "codebase-memory.index"]
  # How long one codebase-memory-mcp or git invocation may take. It sits at
  # Serena's own ceiling: both open an index before they can answer, and a
  # cold one is slow long before it is stuck.
  timeout = "90s"

  [orchestrator.kivgraph]
  # No `binary` and no `repository.index`: Atenea never builds this graph, only
  # reads it. index_project / `kivgraph index` stay out of the funnel entirely
  # (an auditor does not rebuild what it audits). The graph is built by hand with
  # `kivgraph init` + `kivgraph index --full` before this is useful.
  implementations = [
    "kivgraph.definition",
    "kivgraph.references",
    "kivgraph.overview",
    "kivgraph.cross_repo_consumers",
    "kivgraph.get",
    "kivgraph.unresolved_references",
    "kivgraph.status",
  ]
  timeout = "90s"             # opens a graph db cold, same class as serena/codebase-memory

    # [orchestrator.kivgraph.process]
    # Uncomment to have Atenea launch and supervise the kivgraph server
    # itself, the same way [orchestrator.serena.process] above does but over
    # a stdio transport instead of http: Spec.Transport = stdio carries this
    # over the same restart-limit / on_demand / idle-timeout machinery every
    # http-transport process block already uses. Left commented for the
    # same reason serena's own process block above is: `command` below is a
    # path that exists on this machine and no other, and a shipped repo
    # default must never bake in one operator's filesystem. Uncommenting is
    # a per-machine decision, not a compiled default.
    #
    # Persistent stdio MCP server, one for the machine: the graph is a single
    # global corpus and readers share it by atomic generation publishing, so a
    # second copy buys nothing. on_demand so an unused install costs no process.
    #
    # command = "/home/devlabs/.local/opt/kivgraph/bin/kivgraph"
    # args = ["serve"]
    # HOME is load-bearing and MUST be the real one: an isolated/empty HOME makes
    # `serve` scaffold a fresh EMPTY config and publish an empty graph that
    # answers nothing, successfully. Absolute, never ~ .
    # env = ["HOME=/home/tutitoos"]
    # instance = "shared"
    # lifecycle = "on_demand"
    # idle_timeout = "10m"

  [orchestrator.tokensave]
  # tokensave is the second stdio far side, and the one that is not a corpus of
  # repositories but ONE project rooted at a directory: it speaks paths relative
  # to that root, so `root` is required and absolute. Every repository this
  # provider can answer for has to live under it.
  #
  # No `repository.index` either, for a different reason than kivgraph's: this
  # far side re-syncs its own index on every call, so there is nothing for the
  # funnel to trigger.
  # root = "/absolute/path/to/the/served/project"
  implementations = [
    "tokensave.calls",
    "tokensave.context",
    "tokensave.overview",
  ]
  timeout = "90s"             # re-syncs an index before answering: same class as kivgraph

    # [orchestrator.tokensave.process]
    # Same shape as the kivgraph block above and left commented for the same
    # reason: the command below is one machine's path.
    #
    # command = "tokensave"
    # args = ["serve", "--path", "/absolute/path/to/the/served/project"]
    # instance = "shared"
    # lifecycle = "on_demand"
    # idle_timeout = "10m"

  [orchestrator.local]
  # Implementations the stand-in answers for.
  implementations = ["ripgrep"]
  # Directories never descended into. This is a floor, not an equivalent of the
  # rule a real search tool applies: omp reads the repository's own .gitignore,
  # and this list reads nothing. Measured on a probe repository, the two
  # disagree in both directions -- the stand-in skipped a tracked file under
  # build/ that omp searched, and returned two .gitignore'd files omp did not.
  skip_dirs = [".git", "node_modules", "vendor", "dist", "build", ".venv", "target"]

[model]
# The seam through which the two model-backed built-in agents, explore and
# plan, call a model of their own. Unlike the client adapters above, this is
# not a capability provider Atenea dispatches searches to -- it is what an
# agent itself calls to think.

# binary is the CLI executable that answers a turn. A bare name is looked up
# on PATH.
binary = "claude"
# timeout caps one turn, the same measured ceiling as
# orchestrator.claudecode.timeout: it is the same CLI, on the same machine.
timeout = "90s"
# explore and plan name the model for each role, and both are deliberately
# left unset. A fresh install spending real money on its first dispatch
# would be exactly the bad surprise orchestrator.claudecode ships off for;
# a role with no model configured is refused at dispatch rather than
# defaulted to whichever model looks cheapest today, because there is no
# cost data yet to choose one by. Fill these in with a model name or alias
# your CLI resolves ("sonnet", "opus", or a full name) to turn either agent
# on.
explore = ""
plan = ""

[workflow]
# How a graph of agent steps is scheduled. One ceiling per lane, and a lane is
# declared on the agent type itself (`pool`, further down).
#
# Two lanes rather than one so that auditing cannot be crowded out by the work
# it audits: a single ceiling fills every slot with agents exactly when the
# machine is busiest, leaving reviewers queued behind them and answers piling
# up unjudged. 0 lifts a ceiling, the same reading as max_parallel above.
max_parallel_agent = 4

# The review lane, sized the same by default. Nobody has measured what
# reviewing costs against the work it audits on this machine, and a smaller
# number here would be a story with no reading behind it. What the split buys
# is that the two cannot starve each other, not that one is cheaper.
max_parallel_review = 4

[metrics]
# The measurement base: what every attempt cost, on three axes -- time, tokens
# and memory -- filed under the capability asked for and the implementation
# that answered. It is the fuel the funnel will rank on. Until it has real
# figures the funnel ranks on the estimates written further down this file,
# which is guesswork wearing a decimal point.
#
# Turning it off leaves a working core that never learns what anything costs.
enabled = true
# Empty means $XDG_STATE_HOME/atenea/metrics.duckdb, beside the run receipts.
# One embedded file, written by the core and nobody else.
path = ""

# The two rhythms, both served by the one clock so they cannot collide.
#
# Writes are batched: a measurement waits in memory and reaches the disk on the
# beat below. Two moments do not wait for it -- a phase closing and the process
# going down -- so this is the rhythm between them, not the guarantee.
flush = "30s"
# How often the retention ladder is walked: attempts are folded into hours,
# hours into days after a week, days into weeks after a month, weeks into
# months after six. There is always fine detail about the recent past and only
# shapes about the distant one.
compact = "1h"

# How many measurements may wait in memory when writes are failing -- another
# Atenea holding the file, a full disk. Past the ceiling the oldest are dropped
# and counted, because the only thing worse than losing a measurement is not
# knowing that you did. Empty means 10000.
# buffer_limit = 10000

[backup]
# What protects the history. The measurement base, the run receipts and the
# crash notebook are everything Atenea has learned; a disk that loses them
# loses the reason the funnel picks anybody.
#
# Copies are incremental in the only way compatible with dropping the oldest
# one: a file that has not changed is hard-linked to the copy before it, so it
# costs no bytes, and every snapshot stays a complete tree you can restore on
# its own. A chain of deltas would be smaller and would collapse the day the
# rotation removed the base of the chain.
enabled = true
# Empty means a folder of its own BESIDE the state root, never inside it: a
# copy under the tree it copies recurses into itself, and dies with the tree it
# exists to survive. Point this at another disk and it becomes a real backup.
dir = ""
# The rhythm, served by the same clock as the flush and the compaction above so
# the three cannot come due at once and fight over the disk. It is read from
# what is on disk, not from a timer in memory: a service that restarts more
# often than this would otherwise never copy anything at all.
every = "6h"
# How many copies survive. The sixth arrives, the oldest leaves.
keep = 5

[security]
# The files that carry secrets inside them. Reading is free by default, and
# this list is the exception. While exploring, a match here is skipped in
# silence: stopping to ask would break the flow, and writing the skip down
# would cost more than ignoring it is worth.
#
# Deleting this block does NOT disarm the guard, it restores these defaults.
# To have no sensitive files at all, write an explicit empty list.
sensitive = [
  ".env",
  ".env.*",
  ".npmrc",
  ".netrc",
  "*.pem",
  "*.key",
  "*.p12",
  "id_rsa",
  "id_ed25519",
  "*credentials*.json",
  "*service-account*.json",
]

[local_agents]
# The ceiling on an agent type a REPOSITORY declares, in its own
# `.atenea/config.toml`. Such a type has no command of its own: it names one
# this file declares with `runs = "..."` and borrows its spawn. These are the
# permissions it may hold while doing so.
#
# Deleting this block does NOT lift the ceiling, it restores these values --
# which is also what a settings file written before the feature existed gets.
# An absent ceiling that read as no ceiling would be the same mistake as an
# unmeasured cost that reads as free.
#
# effects: read alone. It is what every agent type below holds, so it is the
#   floor of usefulness and not a token gesture. An explicitly empty list
#   turns repository-declared types off entirely: a type that may cause
#   nothing is refused.
# context: the repository alone. It is the only level that cannot leak --
#   `workspace` is the catalog of every repository on this machine, and
#   `history` is what other runs of the same type were told.
effects = ["read"]
context = ["repository"]

# max_duration and max_tokens are unset on purpose. A local type is already
# bounded by the limits of the type it runs, which it may lower and never
# raise; state a number here only to hold a cloned repository below what a
# generous shipped type would otherwise allow it.
# max_duration = "5m"
# max_tokens = 20000

# ---------------------------------------------------------------------------
# Capabilities: the stable "what". Agnostic of any tool, by definition.
# ---------------------------------------------------------------------------

[[capability]]
id = "code.context"
version = "1.0.0"
summary = "From a task in prose, find the code it is actually about before acting."
semantics = """
The cold-start move: given a task described in the person's own words, return \
the declarations, related symbols, optional source and (when planning) tests \
that make the task concrete. This is NOT literal text search -- code.search \
answers that -- and not a position-first symbol lookup either: the caller does \
not know a name or a file yet, which is exactly why it asks. Results are \
repository-relative; a provider whose graph spans several repositories must \
drop foreign rows rather than report paths relative to the wrong root, and say \
that it did. mode is intent: explore maps the territory, plan additionally \
names the tests that cover it.\
"""
effects = ["read"]

  [[capability.input]]
  name = "task"
  type = "string"
  required = true
  summary = "Natural-language description of the task or question."

  [[capability.input]]
  name = "mode"
  type = "string"
  required = false
  enum = ["explore", "plan"]
  summary = "Whether to map the code generally or prepare an implementation plan. Defaults to explore."

  [[capability.input]]
  name = "limit"
  type = "int"
  required = false
  summary = "Maximum number of primary symbols. Defaults to 20."

  [[capability.input]]
  name = "keywords"
  type = "string_list"
  required = false
  summary = "Extra domain words when the task's language may not match symbol names."

  [[capability.input]]
  name = "scope"
  type = "string_list"
  required = false
  summary = "Repository-relative paths to include. Empty means the whole repository."

  [[capability.input]]
  name = "include_snippet"
  type = "bool"
  required = false
  summary = "Intent: include source blocks for the most relevant symbols."

  [[capability.input]]
  name = "snippet_lines"
  type = "int"
  required = false
  summary = "Maximum lines per source block when snippets were requested."

  [[capability.output]]
  name = "symbols"
  type = "record_list"
  required = true
  summary = "The declarations most relevant to the task, ranked by the provider."

    [[capability.output.field]]
    name = "name"
    type = "string"
    required = true
    summary = "The declaration's name."

    [[capability.output.field]]
    name = "kind"
    type = "string"
    required = true
    summary = "The provider's own kind for the declaration."

    [[capability.output.field]]
    name = "path"
    type = "string"
    required = true
    summary = "File holding the declaration, relative to the repository root."

    [[capability.output.field]]
    name = "line"
    type = "int"
    required = true
    summary = "Line where the declaration starts, starting at 1."

    [[capability.output.field]]
    name = "signature"
    type = "string"
    required = false
    summary = "The declaration's signature, when the provider reports it."

    [[capability.output.field]]
    name = "summary"
    type = "string"
    required = false
    summary = "The declaration's own documentation, when the provider reports it."

  [[capability.output]]
  name = "related"
  type = "record_list"
  required = false
  summary = "Other declarations connected to the primary symbols."

    [[capability.output.field]]
    name = "name"
    type = "string"
    required = true

    [[capability.output.field]]
    name = "path"
    type = "string"
    required = true

    [[capability.output.field]]
    name = "line"
    type = "int"
    required = true

  [[capability.output]]
  name = "snippets"
  type = "record_list"
  required = false
  summary = "Source blocks for primary symbols, only when asked for and never from sensitive files."

    [[capability.output.field]]
    name = "name"
    type = "string"
    required = true

    [[capability.output.field]]
    name = "path"
    type = "string"
    required = true

    [[capability.output.field]]
    name = "line"
    type = "int"
    required = true

    [[capability.output.field]]
    name = "code"
    type = "string"
    required = true

  [[capability.output]]
  name = "tests"
  type = "string_list"
  required = false
  summary = "Tests that cover the relevant code, reported in plan mode."

[[capability]]
id = "code.search"
version = "1.0.0"
summary = "Find literal text in a repository without understanding the code."
semantics = """
Flat text search. The engine behind it does not need to parse anything: this is \
the ripgrep-shaped capability, not the symbol-shaped one. Options are stated as \
INTENT, never as a technical order, so the capability is not married to any one \
engine. Snippets carry two lines of context above and below unless the caller \
asks for more.\
"""
effects = ["read", "process"]

  [[capability.input]]
  name = "query"
  type = "string"
  required = true
  summary = "The text to look for."

  [[capability.input]]
  name = "scope"
  type = "string_list"
  required = false
  summary = "Paths to search: the repository, a folder or a single file. Empty means the whole repository."

  [[capability.input]]
  name = "match_case"
  type = "bool"
  required = false
  summary = "Intent: distinguish upper from lower case."

  [[capability.input]]
  name = "regex"
  type = "bool"
  required = false
  summary = "Intent: read the query as a pattern rather than as literal text."

  [[capability.input]]
  name = "whole_word"
  type = "bool"
  required = false
  summary = "Intent: match whole words only."

  [[capability.input]]
