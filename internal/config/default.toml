version = "1.0.0"
summary = "List Android devices visible to ADB and whether each is allowed."
effects = ["read", "device", "process"]

  [[capability.output]]
  name = "devices"
  type = "record_list"
  required = true
  summary = "ADB devices; listing does not authorize a device."

    [[capability.output.field]]
    name = "serial"
    type = "string"
    required = true
    summary = "Stable ADB serial used by the allow-list."

    [[capability.output.field]]
    name = "state"
    type = "string"
    required = true
    summary = "ADB state such as device, offline or unauthorized."

    [[capability.output.field]]
    name = "kind"
    type = "string"
    required = true
    summary = "emulator or physical."

    [[capability.output.field]]
    name = "allowed"
    type = "bool"
    required = true
    summary = "Whether [android] allowed_serials explicitly names it."

    [[capability.output.field]]
    name = "model"
    type = "string"
    required = false
    summary = "Model reported by ADB, when present."

[[capability]]
id = "android.diagnose"
version = "1.0.0"
summary = "Negotiate the optional Android helper without changing application data."
semantics = "Reports backend selection and helper compatibility only. It does not claim that a UI task ran or succeeded."
