  required = true
  summary = "Global vertical window origin in macOS points; may be negative."

  [[capability.output]]
  name = "window_width"
  type = "float"
  required = true
  summary = "Global window width in macOS points."

  [[capability.output]]
  name = "window_height"
  type = "float"
  required = true
  summary = "Global window height in macOS points."

  [[capability.output]]
  name = "scale_x"
  type = "float"
  required = true
  summary = "Returned image pixels per horizontal window point."

  [[capability.output]]
  name = "scale_y"
  type = "float"
  required = true
  summary = "Returned image pixels per vertical window point."

  [[capability.output]]
  name = "dominant_display_id"
