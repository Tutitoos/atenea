# Atenea settings.
#
# One file, on purpose: ceilings, rhythms and the catalog live here and
# nowhere else. Nothing in this file is compiled into the binary -- Atenea is a
# declarative engine, so changing behavior means editing this, not the core.
#
# Conversation with the user is in Spanish; every technical artifact, this file
# included, is in English.

# Version of the core<->adapter contract this file is written against.
contract = "1.0.0"

[core]
# How long a shutdown waits for in-flight work before walking away.
shutdown_grace = "10s"

[orchestrator]
# The agent that receives a commission, explores the repositories in scope,
# splits the work into a graph of steps and hands them out.
#
# How many steps of one wave run at a time. 0 lifts the ceiling. The real brake
# is the memory of the machine, which arrives with the metrics base.
max_parallel = 4

# What ONE COMMISSION may spend, across every step and every paid provider it
# dispatches to. Money is a permission, not a cost: this is the user saying how
# much a piece of work may draw, in the same breath as saying which effects it
# may cause.
#
# The commission, not the call. A run that splits into four steps divides this
# between them and gives back what it did not use; it does not hand each of
# them a fresh one. Same trap as match_limit above, with money instead of
# matches: 0 reads as "no ceiling" and is refused, because a commission with
# nothing stopping it is a runaway. A grant that reaches zero WHILE running is
# a different thing and perfectly ordinary -- from there on the paid providers
# refuse and whoever charges nothing keeps working.
budget_usd = 0.25

# Whether the state of a run in flight is written to disk. Memory is a
# whiteboard; disk is paper. The dump happens when a step closes and again when
# the run closes, and at no other moment.
checkpoints = true
# Empty means $XDG_STATE_HOME/atenea/runs, or ~/.local/state/atenea/runs.
checkpoint_dir = ""

# Who actually executes a step: any of "omp", "claudecode", "serena" and
# "local".
#
# Atenea decides and delegates, so execution always happens on the far side of
# this line, and that far side is an adapter: a dumb translator with no logic
# of its own. It is a list because omp and Claude Code are both first-class
# clients and can be attached at once; each answers for its own
# implementations, and two of them claiming the same one is refused at load.
#
# "omp" is the adapter that ships. "claudecode" drives the Claude Code CLI and
# is off by default because it costs money per call. "serena" is not a CLI at
# all: it is an MCP server, attached the same way because a capability does not
# care whether its provider is a command or a server. "local" is a stand-in
# that searches the disk directly, for a machine with no client installed. An
# empty list leaves the core able to plan and choose, with nothing to dispatch.
runners = ["omp"]

  [orchestrator.omp]
  # The omp executable. A bare name is looked up on PATH, which is the normal
  # case; a full path covers an install somewhere unusual.
  binary = "omp"
  # Implementations the adapter answers for. Anything else it is handed comes
  # back as unavailable, which is the bin that drives fallback.
  implementations = ["ripgrep"]
  # How many matches one search asks omp for.
  #
  # omp always caps. Its own zero is not "no limit": it falls back to a small
  # internal default and then reports the short answer as if it were complete,
  # so Atenea always states the number instead and says out loud when a search
  # reached it.
  match_limit = 10000
  # How long one omp call may take before it is treated as stuck rather than
  # slow. The timeout bin is what lets the core fall back instead of waiting.
  timeout = "30s"

  [orchestrator.claudecode]
  # The claude executable. A bare name is looked up on PATH.
  binary = "claude"
  # Implementations the adapter answers for. This is a different id from
  # ripgrep's on purpose: the same question answered by a model is not the same
  # answer at the same price, and the funnel has to be able to tell them apart.
  implementations = ["claude.search"]
  # This adapter has no ceiling of its own. What a call may spend arrives with
  # the commission, from budget_usd under [orchestrator] above -- money is a
  # permission, and permissions are granted per commission.
  #
  # How long one call may take. A model turn is slower than a tool call by
  # nature, so this sits far above omp's ceiling; past it the turn is stuck
  # rather than thinking, and the timeout bin is what lets the core fall back.
  timeout = "5m"

  [orchestrator.serena]
  # Where Serena is listening. It runs as an MCP server behind a local proxy
  # rather than as a command, so this is a URL and not a binary. The port is
  # whatever the proxy was told to bind; leaving it unpinned is how you end up
  # with a URL that works until the next restart.
  #
  # The host is a literal address and NOT `localhost`, deliberately. The proxy
  # binds 127.0.0.1 -- IPv4, and only IPv4 -- while `localhost` is a name whose
  # answer belongs to the machine, not to Atenea. The day it resolves ::1 first,
  # which is the default nearly everywhere and arrives on its own with a
  # resolver update, a name here would start refusing connections with nothing
  # on this side having changed. An address cannot be reinterpreted.
  # See docs/content/diagnosing-providers.md.
  endpoint = "http://127.0.0.1:40010/mcp"
  # Implementations the adapter answers for. serena.search is deliberately NOT
  # here: this adapter is wired for the symbol capabilities, and claiming a
  # text search it has no code for would make the funnel promise an answer
  # nobody can give.
  implementations = ["serena.definition", "serena.references", "serena.implementations"]
  # How long one call may take. A language server that has to index a cold
  # repository is slow long before it is stuck, so this sits above omp's
  # ceiling and well below a model turn's.
  timeout = "90s"

  [orchestrator.local]
  # Implementations the stand-in answers for.
  implementations = ["ripgrep"]
  # Directories never descended into. A real search tool skips these by reading
  # .gitignore; the stand-in does not read it, so it is told instead.
  skip_dirs = [".git", "node_modules", "vendor", "dist", "build", ".venv", "target"]

[metrics]
# The measurement base: what every attempt cost, on three axes -- time, tokens
# and memory -- filed under the capability asked for and the implementation
# that answered. It is the fuel the funnel will rank on. Until it has real
# figures the funnel ranks on the estimates written further down this file,
# which is guesswork wearing a decimal point.
#
# Turning it off leaves a working core that never learns what anything costs.
enabled = true
# Empty means $XDG_STATE_HOME/atenea/metrics.duckdb, beside the run receipts.
# One embedded file, written by the core and nobody else.
path = ""

# The two rhythms, both served by the one clock so they cannot collide.
#
# Writes are batched: a measurement waits in memory and reaches the disk on the
# beat below. Two moments do not wait for it -- a phase closing and the process
# going down -- so this is the rhythm between them, not the guarantee.
flush = "30s"
# How often the retention ladder is walked: attempts are folded into hours,
# hours into days after a week, days into weeks after a month, weeks into
# months after six. There is always fine detail about the recent past and only
# shapes about the distant one.
compact = "1h"

# How many measurements may wait in memory when writes are failing -- another
# Atenea holding the file, a full disk. Past the ceiling the oldest are dropped
# and counted, because the only thing worse than losing a measurement is not
# knowing that you did. Empty means 10000.
# buffer_limit = 10000

[backup]
# What protects the history. The measurement base, the run receipts and the
# crash notebook are everything Atenea has learned; a disk that loses them
# loses the reason the funnel picks anybody.
#
# Copies are incremental in the only way compatible with dropping the oldest
# one: a file that has not changed is hard-linked to the copy before it, so it
# costs no bytes, and every snapshot stays a complete tree you can restore on
# its own. A chain of deltas would be smaller and would collapse the day the
# rotation removed the base of the chain.
enabled = true
# Empty means a folder of its own BESIDE the state root, never inside it: a
# copy under the tree it copies recurses into itself, and dies with the tree it
# exists to survive. Point this at another disk and it becomes a real backup.
dir = ""
# The rhythm, served by the same clock as the flush and the compaction above so
# the three cannot come due at once and fight over the disk. It is read from
# what is on disk, not from a timer in memory: a service that restarts more
# often than this would otherwise never copy anything at all.
every = "6h"
# How many copies survive. The sixth arrives, the oldest leaves.
keep = 5

[security]
# The files that carry secrets inside them. Reading is free by default, and
# this list is the exception. While exploring, a match here is skipped in
# silence: stopping to ask would break the flow, and writing the skip down
# would cost more than ignoring it is worth.
#
# Deleting this block does NOT disarm the guard, it restores these defaults.
# To have no sensitive files at all, write an explicit empty list.
sensitive = [
  ".env",
  ".env.*",
  ".npmrc",
  ".netrc",
  "*.pem",
  "*.key",
  "*.p12",
  "id_rsa",
  "id_ed25519",
  "*credentials*.json",
  "*service-account*.json",
]

# ---------------------------------------------------------------------------
# Capabilities: the stable "what". Agnostic of any tool, by definition.
# ---------------------------------------------------------------------------

[[capability]]
id = "code.search"
version = "1.0.0"
summary = "Find literal text in a repository without understanding the code."
semantics = """
Flat text search. The engine behind it does not need to parse anything: this is \
the ripgrep-shaped capability, not the symbol-shaped one. Options are stated as \
INTENT, never as a technical order, so the capability is not married to any one \
engine. Snippets carry two lines of context above and below unless the caller \
asks for more.\
"""
effects = ["read"]

  [[capability.input]]
  name = "query"
  type = "string"
  required = true
  summary = "The text to look for."

  [[capability.input]]
  name = "scope"
  type = "string_list"
  required = false
  summary = "Paths to search: the repository, a folder or a single file. Empty means the whole repository."

  [[capability.input]]
  name = "match_case"
  type = "bool"
  required = false
  summary = "Intent: distinguish upper from lower case."

  [[capability.input]]
  name = "regex"
  type = "bool"
  required = false
  summary = "Intent: read the query as a pattern rather than as literal text."

  [[capability.input]]
  name = "whole_word"
  type = "bool"
  required = false
  summary = "Intent: match whole words only."

  [[capability.input]]
  name = "file_types"
  type = "string_list"
  required = false
  summary = "Intent: restrict the search to these file types."

  [[capability.input]]
  name = "context_lines"
  type = "int"
  required = false
  summary = "Lines of context around each match. Defaults to 2 above and 2 below."

  [[capability.output]]
  name = "matches"
  type = "record_list"
  required = true
  summary = "Every hit, in the order the engine found them."

    [[capability.output.field]]
    name = "path"
    type = "string"
    required = true
    summary = "File containing the match, relative to the repository root."

    [[capability.output.field]]
    name = "line"
    type = "int"
    required = true
    summary = "Line number of the match, starting at 1."

    [[capability.output.field]]
    name = "column"
    type = "int"
    required = true
    summary = "Column where the match starts, starting at 1."

    [[capability.output.field]]
    name = "snippet"
    type = "string"
    required = false
    summary = "The matching line with its surrounding context."

[[capability]]
id = "symbol.definition"
version = "1.0.0"
summary = "From a symbol, find the one place where it is born."
semantics = """
Where a symbol is DEFINED, not where it is mentioned -- that second question is \
code.search's, and answering this one with a text match would be a different \
answer wearing the same name. The symbol is given by POSITION: a workspace of \
forty repositories holds the same name many times over, and a position is \
unambiguous where a name is not. The name is a hint -- it breaks a tie and it \
makes the request readable -- and an implementation may ignore it. The location \
always comes back; the fragment only when asked, so a caller that needs to read \
the definition does not pay a second round trip for it.\
"""
effects = ["read"]

  [[capability.input]]
  name = "file"
  type = "string"
  required = true
  summary = "File holding the symbol, relative to the repository root."

  [[capability.input]]
  name = "line"
  type = "int"
  required = true
  summary = "Line where the symbol appears, starting at 1."

  [[capability.input]]
  name = "column"
  type = "int"
  required = true
  summary = "Column where the symbol starts on that line, starting at 1."

  [[capability.input]]
  name = "name"
  type = "string"
  required = false
  summary = "Hint: the symbol's name, for tie-breaking and for reading the request."

  [[capability.input]]
  name = "include_snippet"
  type = "bool"
  required = false
  summary = "Intent: return the definition itself, not only where it is."

  [[capability.input]]
  name = "snippet_lines"
  type = "int"
  required = false
  summary = "How much of the definition to return. Small by default, on purpose."

  [[capability.output]]
  name = "location"
  type = "record"
  required = true
  summary = "Where the symbol is defined."

    [[capability.output.field]]
    name = "path"
    type = "string"
    required = true
    summary = "File holding the definition, relative to the repository root."

    [[capability.output.field]]
    name = "line"
    type = "int"
    required = true
    summary = "Line where the definition starts, starting at 1."

    [[capability.output.field]]
    name = "snippet"
    type = "string"
    required = false
    summary = "The definition itself, present only when it was asked for."

[[capability]]
id = "symbol.references"
version = "1.0.0"
summary = "From a symbol, find every place it is used."
semantics = """
Every site that USES or mentions the symbol, which is the opposite direction \
from symbol.definition and inherits its way of naming one: position first, name \
as a hint. The one thing it adds is scope, and it is not decoration -- with \
forty repositories a question asked without one drowns the caller in hundreds \
of hits. Empty scope means the whole repository, deliberately, so the default \
is honest rather than quietly narrow.\
"""
effects = ["read"]

  [[capability.input]]
  name = "file"
  type = "string"
  required = true
  summary = "File holding the symbol, relative to the repository root."

  [[capability.input]]
  name = "line"
  type = "int"
  required = true
  summary = "Line where the symbol appears, starting at 1."

  [[capability.input]]
  name = "column"
  type = "int"
  required = true
  summary = "Column where the symbol starts on that line, starting at 1."

  [[capability.input]]
  name = "name"
  type = "string"
  required = false
  summary = "Hint: the symbol's name, for tie-breaking and for reading the request."

  [[capability.input]]
  name = "scope"
  type = "string_list"
  required = false
  summary = "Paths to look in. Empty means the whole repository."

  [[capability.input]]
  name = "include_snippet"
  type = "bool"
  required = false
  summary = "Intent: return the line at each use site, not only where it is."

  [[capability.input]]
  name = "snippet_lines"
  type = "int"
  required = false
  summary = "How much to return around each use. Small by default, on purpose."

  [[capability.output]]
  name = "locations"
  type = "record_list"
  required = true
  summary = "Every place the symbol is used, in the order the provider found them."

    [[capability.output.field]]
    name = "path"
    type = "string"
    required = true
    summary = "File holding the use, relative to the repository root."

    [[capability.output.field]]
    name = "line"
    type = "int"
    required = true
    summary = "Line of the use, starting at 1."

    [[capability.output.field]]
    name = "snippet"
    type = "string"
    required = false
    summary = "The line at the use site, present only when it was asked for."

[[capability]]
id = "symbol.implementations"
version = "1.0.0"
summary = "From something abstract, find who really implements it."
semantics = """
Given an interface or an overridable method, the concrete implementations \
behind it. Same mould as symbol.references down to the last field, because the \
question is shaped the same way and only its meaning changes: not who mentions \
this, but who fulfils it. Asking it of something concrete is not an error, it \
is an empty answer.\
"""
effects = ["read"]

  [[capability.input]]
  name = "file"
  type = "string"
  required = true
  summary = "File holding the symbol, relative to the repository root."

  [[capability.input]]
  name = "line"
  type = "int"
  required = true
  summary = "Line where the symbol appears, starting at 1."

  [[capability.input]]
  name = "column"
  type = "int"
  required = true
  summary = "Column where the symbol starts on that line, starting at 1."

  [[capability.input]]
  name = "name"
  type = "string"
  required = false
  summary = "Hint: the symbol's name, for tie-breaking and for reading the request."

  [[capability.input]]
  name = "scope"
  type = "string_list"
  required = false
  summary = "Paths to look in. Empty means the whole repository."

  [[capability.input]]
  name = "include_snippet"
  type = "bool"
  required = false
  summary = "Intent: return the line at each implementation, not only where it is."

  [[capability.input]]
  name = "snippet_lines"
  type = "int"
  required = false
  summary = "How much to return around each implementation. Small by default."

  [[capability.output]]
  name = "locations"
  type = "record_list"
  required = true
  summary = "Every concrete implementation, in the order the provider found them."

    [[capability.output.field]]
    name = "path"
    type = "string"
    required = true
    summary = "File holding the implementation, relative to the repository root."

    [[capability.output.field]]
    name = "line"
    type = "int"
    required = true
    summary = "Line where the implementation starts, starting at 1."

    [[capability.output.field]]
    name = "snippet"
    type = "string"
    required = false
    summary = "The line at the implementation, present only when it was asked for."

# ---------------------------------------------------------------------------
# Implementations: the "who and how". Four blocks each -- capability,
# constraints, cost and health.
#
# Health starts unknown for everyone: nothing has been probed yet. Declare a
# state here to take a provider out of the running by hand; once the health
# checker exists, live probes own this value.
# ---------------------------------------------------------------------------

[[implementation]]
id = "ripgrep"
provider = "ripgrep"
capability = "code.search"

  [implementation.constraints]
  languages = []          # agnostic: it does not parse anything
  requires_index = false
  min_scale = ""
  max_scale = ""

  [implementation.cost]
  estimated_duration = "80ms"
  estimated_tokens = 400

[[implementation]]
id = "serena.search"
provider = "serena"
capability = "code.search"

  [implementation.constraints]
  languages = ["go", "typescript", "javascript", "python", "java", "rust", "php", "csharp"]
  requires_index = true
  min_scale = ""
  max_scale = ""

  [implementation.cost]
  estimated_duration = "600ms"
  estimated_tokens = 900

[[implementation]]
id = "codebase-memory.search"
provider = "codebase-memory"
capability = "code.search"

  [implementation.constraints]
  languages = []
  requires_index = true
  min_scale = "medium"    # the graph only pays for itself on a big repository
  max_scale = ""

  [implementation.cost]
  estimated_duration = "1.2s"
  estimated_tokens = 700

[[implementation]]
id = "claude.search"
provider = "claude-code"
capability = "code.search"

  [implementation.constraints]
  languages = []          # a model reads whatever it is shown
  requires_index = false
  min_scale = ""
  max_scale = ""

  [implementation.cost]
  # Two orders of magnitude above ripgrep on both axes, and that is the point:
  # the funnel is cost-aware, so declaring this honestly is what keeps a model
  # from being chosen for work a tool already does well. It wins when the
  # cheaper providers are unhealthy or cannot work here at all.
  estimated_duration = "12s"
  estimated_tokens = 20000

# The three symbol implementations share a provider, and therefore share an
# index and a language list. Serena drives a language server per language: it
# understands only the ones it has a server for, and it is useless on a
# repository it has not indexed. Both facts are constraints, so both live here
# and not in the capability -- a capability that grew a language list would
# stop being swappable, which is the whole point of having one.
#
# The cost of all three is one activation plus two round trips: the adapter
# turns the position the capability speaks into the name path Serena speaks,
# and it asks Serena itself to do it rather than parsing code on its own.

[[implementation]]
id = "serena.definition"
provider = "serena"
capability = "symbol.definition"

  [implementation.constraints]
  languages = ["go", "typescript", "javascript", "python", "java", "rust", "php", "csharp"]
  requires_index = true
  min_scale = ""
  max_scale = ""

  [implementation.cost]
  estimated_duration = "700ms"
  estimated_tokens = 500

[[implementation]]
id = "serena.references"
provider = "serena"
capability = "symbol.references"

  [implementation.constraints]
  languages = ["go", "typescript", "javascript", "python", "java", "rust", "php", "csharp"]
  requires_index = true
  min_scale = ""
  max_scale = ""

  [implementation.cost]
  # Dearer than a definition: one answer versus every use site in the scope.
  estimated_duration = "1.5s"
  estimated_tokens = 1200

[[implementation]]
id = "serena.implementations"
provider = "serena"
capability = "symbol.implementations"

  [implementation.constraints]
  languages = ["go", "typescript", "javascript", "python", "java", "rust", "php", "csharp"]
  requires_index = true
  min_scale = ""
  max_scale = ""

  [implementation.cost]
  estimated_duration = "1.5s"
  estimated_tokens = 1200

# ---------------------------------------------------------------------------
# Repositories: the unit of work. Not the project -- the repository.
# ---------------------------------------------------------------------------

[[repository]]
id = "current"
path = "."
languages = ["go"]
scale = "small"
indexed_by = []           # providers holding a ready index for this repository

# ---------------------------------------------------------------------------
# Selector rules: the user's word, above any automatic ranking.
# Omit `repository` to make a rule apply everywhere.
# ---------------------------------------------------------------------------

# [[selector.rule]]
# capability = "code.search"
# repository = "current"
# prefer = "ripgrep"
