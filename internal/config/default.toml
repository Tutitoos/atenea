# The five Serena symbol implementations share a provider, and therefore share an
# index and a language list. Serena drives a language server per language: it
# understands only the ones it has a server for, and it is useless on a
# repository it has not indexed. Both facts are constraints, so both live here
# and not in the capability -- a capability that grew a language list would
# stop being swappable, which is the whole point of having one.
#
# The position-first implementations cost one activation plus their own round
# trips: the adapter
# turns the position the capability speaks into the name path Serena speaks,
# and it asks Serena itself to do it rather than parsing code on its own.

[[implementation]]
