summary = "From a change, find what it reaches."
semantics = """
What a change reaches, not merely what it touched -- touched is the easy half, \
the list of files different from the baseline, and it comes back too because the \
graph answer is unreadable without it. The hard half is everything that calls \
into what changed and would feel it: this is symbol.calls, asked once for every \
symbol the change actually touched instead of once by hand for each. A directly \
changed symbol is simply the zero-distance entry -- no separate flag marks it, \
because depth already says so. baseline names the far side of the comparison as \
intent, a point in the repository's history to measure the current state \
against, the same reason code.search's options are intent and not one version \
control system's own syntax. depth bounds the walk the same way and for the same \
reason as its sibling's.\
"""
