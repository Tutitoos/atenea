# The theme is pulled as a Hugo module, so there is no vendored copy to keep in
# sync and no git submodule to forget to initialise.
[module]
  [[module.imports]]
    path = "github.com/alex-shpak/hugo-book"

[markup.goldmark.renderer]
  unsafe = false

[markup.highlight]
  noClasses = false
  style = "github"
