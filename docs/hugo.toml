# Hugo turns the plain text under docs/content into the documentation site
# served by GitHub Pages. The docs live in this repository on purpose: beside
# the code they travel in the same pull request and go stale far more slowly
# than a wiki, which is a separate repository nobody remembers to update.
#
# baseURL is overridden by the workflow with the real Pages URL.
baseURL = "https://tutitoos.github.io/atenea/"
locale = "en-us"
title = "Atenea"
enableGitInfo = false

[params]
  description = "Atenea decides and delegates: a local orchestration core for agents and MCP tooling."
  version = "1.0.5"
  github = "https://github.com/Tutitoos/atenea"
  BookTheme = "auto"
  BookSearch = true
  BookSection = "*"
  BooktoC = true
  BookRepo = "https://github.com/Tutitoos/atenea"

