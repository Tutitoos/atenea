# Pre-commit checks, run on the developer machine before anything reaches CI.
#
# lefthook, not Husky: Husky belongs to the Node world and this project is Go.
# Install once with `lefthook install`.

pre-commit:
  parallel: true
  commands:
    gofmt:
      glob: "*.go"
      # The staged-file list is read from git inside the script, not
      # interpolated into this line. `gofmt -l {staged_files}` split a path
      # containing a space into two arguments that name nothing, so the hook
      # rejected a correctly formatted tree, and it also passed the paths of
      # files staged for deletion, which are gone by the time gofmt looks.
      run: bash scripts/gofmt-staged.sh

    govet:
      glob: "*.go"
      run: go vet ./...

    golangci-lint:
      glob: "*.go"
      run: |
        # Find the binary the same way the CI workflow does: through the Go
        # toolchain, never by assuming PATH. A shell without GOPATH/bin
        # would otherwise fail with "command not found" and look like the
        # gate is missing.
        bin="$(go env GOPATH)/bin/golangci-lint"
        if [ ! -x "$bin" ]; then
          echo "golangci-lint is not installed at $bin"
          echo "run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2"
          exit 1
        fi
        "$bin" run

    host-footer:
      # No glob and no staged-file filter on purpose: this gate does not watch
      # our files, it watches somebody else's. Atenea's widget wins opencode's
      # `sidebar_footer` slot outright, so a client upgrade that adds a line
      # there deletes it from the screen with no error anywhere. The check costs
      # half a second and it skips on a machine with no client installed, which
      # is every CI runner -- the scheduled host-footer workflow covers those.
      run: go test -count=1 ./internal/statusline/ -run HostFooter
pre-push:
  commands:
    test:
      run: go test -race ./...
